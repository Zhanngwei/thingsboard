<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
  <title id="title">ThingsBoard LwM2M 注册与观测流程架构</title>
  <desc id="desc">展示 Bootstrap、Main Leshan Server、安全认证、Registration 与 Observation stores、Transport session、Actor、Rule Engine Queue 和数据库边界。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f2937"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#047857"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 34px Arial, "Microsoft YaHei", sans-serif; fill: #111827; }
      .subtitle { font: 500 17px Arial, "Microsoft YaHei", sans-serif; fill: #374151; }
      .lane { fill: #f8fafc; stroke: #334155; stroke-width: 2.5; }
      .lane-head-device { fill: #dbeafe; stroke: #1e40af; stroke-width: 2.5; }
      .lane-head-protocol { fill: #fef3c7; stroke: #92400e; stroke-width: 2.5; }
      .lane-head-transport { fill: #e0f2fe; stroke: #075985; stroke-width: 2.5; }
      .lane-head-platform { fill: #dcfce7; stroke: #166534; stroke-width: 2.5; }
      .lane-title { font: 700 21px Arial, "Microsoft YaHei", sans-serif; fill: #111827; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2.5; rx: 6; }
      .box-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.7; rx: 6; }
      .box-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 2.7; rx: 6; }
      .box-green { fill: #f0fdf4; stroke: #047857; stroke-width: 2.7; rx: 6; }
      .box-red { fill: #fff1f2; stroke: #be123c; stroke-width: 2.7; rx: 6; }
      .box-gray { fill: #f3f4f6; stroke: #374151; stroke-width: 2.5; rx: 6; }
      .box-title { font: 700 17px Arial, "Microsoft YaHei", sans-serif; fill: #111827; text-anchor: middle; }
      .box-text { font: 500 14px Arial, "Microsoft YaHei", sans-serif; fill: #1f2937; text-anchor: middle; }
      .small { font: 500 13px Arial, "Microsoft YaHei", sans-serif; fill: #374151; }
      .note { fill: #fff7d6; stroke: #8a5a00; stroke-width: 2.2; rx: 5; }
      .note-title { font: 700 15px Arial, "Microsoft YaHei", sans-serif; fill: #713f12; }
      .note-text { font: 500 13px Arial, "Microsoft YaHei", sans-serif; fill: #3f2d0c; }
      .arrow { fill: none; stroke: #1f2937; stroke-width: 2.6; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #1d4ed8; stroke-width: 3; marker-end: url(#arrowBlue); }
      .arrow-green { fill: none; stroke: #047857; stroke-width: 3; marker-end: url(#arrowGreen); }
      .dash { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .edge-label { font: 600 13px Arial, "Microsoft YaHei", sans-serif; fill: #111827; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .boundary { fill: none; stroke: #be123c; stroke-width: 2.4; stroke-dasharray: 10 7; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1240"/>
  <text class="title" x="50" y="52">ThingsBoard release-3.6：LwM2M 注册与观测架构</text>
  <text class="subtitle" x="50" y="82">Leshan 协议状态、Transport/Actor 会话、Queue 与数据库是相互分离的确认和持久化边界</text>

  <rect class="lane" x="40" y="110" width="300" height="965" rx="6"/>
  <rect class="lane-head-device" x="40" y="110" width="300" height="54" rx="6"/>
  <text class="lane-title" x="190" y="145" text-anchor="middle">设备与网络</text>

  <rect class="lane" x="365" y="110" width="430" height="965" rx="6"/>
  <rect class="lane-head-protocol" x="365" y="110" width="430" height="54" rx="6"/>
  <text class="lane-title" x="580" y="145" text-anchor="middle">Leshan 协议服务</text>

  <rect class="lane" x="820" y="110" width="445" height="965" rx="6"/>
  <rect class="lane-head-transport" x="820" y="110" width="445" height="54" rx="6"/>
  <text class="lane-title" x="1042" y="145" text-anchor="middle">ThingsBoard Transport 状态</text>

  <rect class="lane" x="1290" y="110" width="470" height="965" rx="6"/>
  <rect class="lane-head-platform" x="1290" y="110" width="470" height="54" rx="6"/>
  <text class="lane-title" x="1525" y="145" text-anchor="middle">平台 Queue、Actor 与数据</text>

  <rect class="box-blue" x="75" y="205" width="230" height="112"/>
  <text class="box-title" x="190" y="238">LwM2M Client</text>
  <text class="box-text" x="190" y="264">Object / Instance / Resource</text>
  <text class="box-text" x="190" y="287">PSK / RPK / X.509 / NO_SEC</text>

  <rect class="box-gray" x="75" y="365" width="230" height="105"/>
  <text class="box-title" x="190" y="397">协议消息</text>
  <text class="box-text" x="190" y="423">Bootstrap / Registration / Update</text>
  <text class="box-text" x="190" y="446">Deregister / Read / Observe / Cancel</text>

  <rect class="box-red" x="75" y="760" width="230" height="115"/>
  <text class="box-title" x="190" y="792">原生 CoAP Device API</text>
  <text class="box-text" x="190" y="819">5683 / 5684</text>
  <text class="box-text" x="190" y="844">/api/v1/{accessToken}</text>
  <text class="box-text" x="190" y="866">不进入本章 Leshan 流程</text>

  <rect class="box-amber" x="405" y="195" width="350" height="118"/>
  <text class="box-title" x="580" y="226">Leshan Bootstrap Server</text>
  <text class="box-text" x="580" y="252">5687 CoAP / 5688 DTLS</text>
  <text class="box-text" x="580" y="276">Discover → Read /1 → Delete → Write /0,/1</text>
  <text class="box-text" x="580" y="298">Bootstrap Finish</text>

  <rect class="box-amber" x="405" y="350" width="350" height="118"/>
  <text class="box-title" x="580" y="381">Leshan Main Server</text>
  <text class="box-text" x="580" y="407">5685 CoAP / 5686 DTLS</text>
  <text class="box-text" x="580" y="431">Registration / Presence / Observation</text>
  <text class="box-text" x="580" y="454">SingleObservation notification</text>

  <rect class="box" x="405" y="510" width="165" height="132"/>
  <text class="box-title" x="487" y="541">Security Store</text>
  <text class="box-text" x="487" y="568">endpoint / identity</text>
  <text class="box-text" x="487" y="591">certificate</text>
  <text class="box-text" x="487" y="614">Core credential lookup</text>

  <rect class="box" x="590" y="510" width="165" height="132"/>
  <text class="box-title" x="672" y="541">Protocol Stores</text>
  <text class="box-text" x="672" y="568">Registration</text>
  <text class="box-text" x="672" y="591">Observation token</text>
  <text class="box-text" x="672" y="614">DTLS session</text>

  <rect class="box-gray" x="405" y="685" width="350" height="118"/>
  <text class="box-title" x="580" y="716">Store 实现选择</text>
  <text class="box-text" x="580" y="742">默认 cache.type=caffeine：内存 / dummy store</text>
  <text class="box-text" x="580" y="768">cache.type=redis：Registration / Security</text>
  <text class="box-text" x="580" y="790">Client / Model / OTA / DTLS Redis stores</text>

  <rect class="box-blue" x="860" y="195" width="365" height="115"/>
  <text class="box-title" x="1042" y="227">DefaultLwM2mUplinkMsgHandler</text>
  <text class="box-text" x="1042" y="253">onRegistered / updatedReg / unReg</text>
  <text class="box-text" x="1042" y="277">Object → Instance → Resource 展开</text>
  <text class="box-text" x="1042" y="299">Device Profile mapping</text>

  <rect class="box-blue" x="860" y="345" width="175" height="134"/>
  <text class="box-title" x="947" y="376">LwM2mClient</text>
  <text class="box-text" x="947" y="402">endpoint / registration</text>
  <text class="box-text" x="947" y="425">session / state / profile</text>
  <text class="box-text" x="947" y="448">resource value cache</text>

  <rect class="box-blue" x="1055" y="345" width="170" height="134"/>
  <text class="box-title" x="1140" y="376">Session Manager</text>
  <text class="box-text" x="1140" y="402">ASYNC SessionInfo</text>
  <text class="box-text" x="1140" y="425">OPEN / CLOSED</text>
  <text class="box-text" x="1140" y="448">Attr / RPC subscribe</text>

  <rect class="box" x="860" y="520" width="365" height="128"/>
  <text class="box-title" x="1042" y="551">DefaultLwM2mDownlinkMsgHandler</text>
  <text class="box-text" x="1042" y="577">Read / Observe / Write Attributes</text>
  <text class="box-text" x="1042" y="601">Cancel one/all / Write / Execute</text>
  <text class="box-text" x="1042" y="625">PSM/eDRX gate + timeout marks asleep</text>

  <rect class="box" x="860" y="690" width="365" height="120"/>
  <text class="box-title" x="1042" y="721">RPC 与 OTA</text>
  <text class="box-text" x="1042" y="747">RPC 复用 Leshan downlink 与当前 Registration</text>
  <text class="box-text" x="1042" y="772">Firmware /5、Software /9、可选 /19</text>
  <text class="box-text" x="1042" y="795">状态/结果转换为平台 telemetry</text>

  <rect class="note" x="860" y="855" width="365" height="150"/>
  <text class="note-title" x="882" y="885">Device Profile 映射</text>
  <text class="note-text" x="882" y="912">keyName：versioned path → 平台 key</text>
  <text class="note-text" x="882" y="936">observe：建立 Leshan Observation</text>
  <text class="note-text" x="882" y="960">attribute / telemetry：选择平台消息类型</text>
  <text class="note-text" x="882" y="984">attributeLwm2m：pmin/pmax/gt/lt/st/dim</text>

  <rect class="box-green" x="1330" y="190" width="390" height="105"/>
  <text class="box-title" x="1525" y="222">Transport API / Core Credential Service</text>
  <text class="box-text" x="1525" y="248">ValidateDeviceLwM2MCredentialsRequestMsg</text>
  <text class="box-text" x="1525" y="273">device + device_profile + device_credentials</text>

  <rect class="box-green" x="1330" y="335" width="185" height="122"/>
  <text class="box-title" x="1422" y="366">Core Queue</text>
  <text class="box-text" x="1422" y="392">logical partitions=10</text>
  <text class="box-text" x="1422" y="416">tenant/device routing</text>
  <text class="box-text" x="1422" y="440">group tb-core-node</text>

  <rect class="box-green" x="1535" y="335" width="185" height="122"/>
  <text class="box-title" x="1627" y="366">Device Actor</text>
  <text class="box-text" x="1627" y="392">session / subscriptions</text>
  <text class="box-text" x="1627" y="416">shared attributes</text>
  <text class="box-text" x="1627" y="440">server-side RPC</text>

  <rect class="box-green" x="1330" y="505" width="390" height="116"/>
  <text class="box-title" x="1525" y="536">Rule Engine Queue</text>
  <text class="box-text" x="1525" y="562">POST_ATTRIBUTES_REQUEST / POST_TELEMETRY_REQUEST</text>
  <text class="box-text" x="1525" y="586">默认 in-memory；Kafka 时 tb_rule_engine.main</text>
  <text class="box-text" x="1525" y="608">logical partitions=10 / group re-main-consumer</text>

  <rect class="box-green" x="1330" y="665" width="390" height="112"/>
  <text class="box-title" x="1525" y="696">Rule Chain Save Nodes</text>
  <text class="box-text" x="1525" y="722">Save Attributes → telemetry service</text>
  <text class="box-text" x="1525" y="746">Save Timeseries → history/latest DAO</text>

  <rect class="box-green" x="1330" y="820" width="390" height="155"/>
  <text class="box-title" x="1525" y="851">持久化数据</text>
  <text class="box-text" x="1525" y="878">attribute_kv</text>
  <text class="box-text" x="1525" y="902">ts_kv / TimescaleDB / Cassandra history</text>
  <text class="box-text" x="1525" y="926">ts_kv_latest</text>
  <text class="box-text" x="1525" y="950">resource：LWM2M_MODEL XML（不是设备当前值）</text>

  <path class="arrow-blue" d="M305 245 H405"/>
  <text class="edge-label" x="328" y="232">可选 Bootstrap</text>
  <path class="arrow-blue" d="M305 405 H405"/>
  <text class="edge-label" x="326" y="392">注册与观测</text>
  <path class="arrow" d="M580 313 V350"/>
  <text class="edge-label" x="592" y="336">完成后连接 Main</text>
  <path class="arrow" d="M580 468 V510"/>
  <path class="arrow" d="M580 468 C580 488 672 488 672 510"/>
  <path class="dash" d="M405 576 C350 576 350 242 405 242"/>
  <text class="edge-label" x="354" y="555" transform="rotate(-90 354 555)">Bootstrap security/config</text>

  <path class="arrow-blue" d="M755 405 H860"/>
  <text class="edge-label" x="773" y="392">listener callbacks</text>
  <path class="arrow" d="M755 576 C790 576 805 252 860 252"/>
  <text class="edge-label" x="770" y="550">认证结果</text>
  <path class="arrow" d="M755 600 C800 600 810 412 860 412"/>
  <text class="edge-label" x="772" y="620">Registration / Observation</text>
  <path class="dash" d="M672 642 V685"/>

  <path class="arrow" d="M1042 310 V345"/>
  <path class="arrow" d="M1035 412 H1055"/>
  <path class="arrow-blue" d="M1042 520 V479"/>
  <text class="edge-label" x="1055" y="505">Read / Observe callback</text>
  <path class="arrow-blue" d="M860 582 C800 582 800 405 755 405"/>
  <text class="edge-label" x="772" y="570">LeshanServer.send()</text>
  <path class="arrow" d="M1042 648 V690"/>
  <path class="arrow" d="M1042 810 V855"/>

  <path class="arrow-green" d="M755 545 C980 120 1210 120 1330 230"/>
  <text class="edge-label" x="960" y="125">Transport API request/reply</text>
  <path class="arrow-green" d="M1225 405 H1330"/>
  <text class="edge-label" x="1242" y="392">OPEN / subscriptions</text>
  <path class="arrow-green" d="M1515 396 H1535"/>
  <path class="arrow-green" d="M1225 582 H1330"/>
  <text class="edge-label" x="1240" y="569">mapped KV + EMPTY callback</text>
  <path class="arrow-green" d="M1525 621 V665"/>
  <text class="edge-label" x="1538" y="650">consumer poll</text>
  <path class="arrow-green" d="M1525 777 V820"/>
  <text class="edge-label" x="1538" y="807">DAO callback</text>
  <path class="arrow" d="M1627 457 C1627 485 1260 485 1225 735"/>
  <text class="edge-label" x="1390" y="477">RPC / shared attributes / OTA target</text>

  <rect class="boundary" x="1310" y="485" width="430" height="510" rx="8"/>
  <text class="note-title" x="1322" y="1022">红色虚线：Queue/Rule Engine/数据库边界</text>

  <rect class="note" x="40" y="1100" width="1720" height="100"/>
  <text class="note-title" x="65" y="1132">确认与事务结论</text>
  <text class="note-text" x="65" y="1158">Registration 的 2.01、Observe notification 的 CoAP 确认、Queue producer ack、Rule Engine 执行和数据库 commit 互不等价。</text>
  <text class="note-text" x="65" y="1182">Registration/Observation 默认在 Leshan 内存 store；Redis 仅在 cache.type=redis 时启用。业务 attributes/telemetry 只有经过 Rule Chain Save node 才写数据库。</text>
</svg>
