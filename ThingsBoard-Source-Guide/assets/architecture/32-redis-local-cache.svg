<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1560" viewBox="0 0 2200 1560" role="img" aria-labelledby="title desc">
  <title id="title">ThingsBoard 3.6 Redis 与本地缓存架构</title>
  <desc id="desc">展示自定义事务缓存、Spring Cache、Caffeine、Redis、PostgreSQL、提交后失效、一致性窗口和故障边界。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/></marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#991b1b"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#111827;letter-spacing:0}
      .title{font-size:42px;font-weight:700}.subtitle{font-size:20px;fill:#374151}.section{font-size:28px;font-weight:700}
      .label{font-size:23px;font-weight:700}.small{font-size:19px}.tiny{font-size:17px;fill:#374151}.edge{font-size:17px;font-weight:600}
      .band{fill:#f8fafc;stroke:#334155;stroke-width:2}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}
      .green{fill:#dcfce7;stroke:#166534;stroke-width:3}.amber{fill:#fef3c7;stroke:#92400e;stroke-width:3}
      .red{fill:#fee2e2;stroke:#991b1b;stroke-width:3}.violet{fill:#ede9fe;stroke:#5b21b6;stroke-width:3}
      .gray{fill:#f3f4f6;stroke:#374151;stroke-width:3}.white{fill:#ffffff;stroke:#374151;stroke-width:2}
      .line{fill:none;stroke:#1f2937;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#1f2937;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow)}
      .redline{fill:none;stroke:#991b1b;stroke-width:3;marker-end:url(#redArrow)}
    </style>
  </defs>

  <rect width="2200" height="1560" fill="#ffffff"/>
  <text x="1100" y="58" text-anchor="middle" class="title">ThingsBoard 3.6 Redis 与本地缓存架构</text>
  <text x="1100" y="92" text-anchor="middle" class="subtitle">Cache-Aside · 负缓存 · 回填 CAS · AFTER_COMMIT 失效 · 多节点一致性</text>

  <rect x="35" y="125" width="2130" height="470" rx="6" class="band"/>
  <text x="1100" y="164" text-anchor="middle" class="section">API 与条件装配</text>

  <rect x="75" y="205" width="330" height="135" rx="5" class="gray"/>
  <text x="240" y="245" text-anchor="middle" class="label">业务服务</text>
  <text x="240" y="280" text-anchor="middle" class="small">Device / Asset / Relation</text>
  <text x="240" y="312" text-anchor="middle" class="small">Attributes / Security / Notification</text>

  <rect x="500" y="190" width="390" height="175" rx="5" class="blue"/>
  <text x="695" y="230" text-anchor="middle" class="label">TbTransactionalCache&lt;K,V&gt;</text>
  <text x="695" y="266" text-anchor="middle" class="small">大多数 DAO cache</text>
  <text x="695" y="298" text-anchor="middle" class="small">getAndPutInTransaction</text>
  <text x="695" y="330" text-anchor="middle" class="small">miss / null wrapper / CAS 回填</text>

  <rect x="500" y="415" width="390" height="125" rx="5" class="violet"/>
  <text x="695" y="454" text-anchor="middle" class="label">Spring Cache annotations</text>
  <text x="695" y="489" text-anchor="middle" class="small">System Security / Notification Settings</text>
  <text x="695" y="518" text-anchor="middle" class="tiny">独立于自定义 transaction cache</text>

  <rect x="1000" y="205" width="300" height="135" rx="5" class="amber"/>
  <text x="1150" y="245" text-anchor="middle" class="label">cache.type</text>
  <text x="1150" y="280" text-anchor="middle" class="small">默认 caffeine</text>
  <text x="1150" y="312" text-anchor="middle" class="small">显式 redis</text>

  <rect x="1430" y="190" width="315" height="175" rx="5" class="green"/>
  <text x="1588" y="230" text-anchor="middle" class="label">Caffeine</text>
  <text x="1588" y="266" text-anchor="middle" class="small">每 JVM entry / lock / tx map</text>
  <text x="1588" y="298" text-anchor="middle" class="small">expireAfterWrite</text>
  <text x="1588" y="330" text-anchor="middle" class="small">maximumWeight</text>

  <rect x="1830" y="190" width="295" height="175" rx="5" class="blue"/>
  <text x="1978" y="230" text-anchor="middle" class="label">Redis</text>
  <text x="1978" y="266" text-anchor="middle" class="small">共享 keyspace，无本地 L1</text>
  <text x="1978" y="298" text-anchor="middle" class="small">key TTL + WATCH/MULTI/EXEC</text>
  <text x="1978" y="330" text-anchor="middle" class="small">standalone / sentinel / cluster</text>

  <rect x="1430" y="415" width="315" height="125" rx="5" class="green"/>
  <text x="1588" y="454" text-anchor="middle" class="label">SimpleCacheManager</text>
  <text x="1588" y="489" text-anchor="middle" class="small">非 transaction-aware</text>
  <text x="1588" y="518" text-anchor="middle" class="tiny">标准 Spring Cache 路径</text>

  <rect x="1830" y="415" width="295" height="125" rx="5" class="blue"/>
  <text x="1978" y="454" text-anchor="middle" class="label">RedisCacheManager</text>
  <text x="1978" y="489" text-anchor="middle" class="small">transaction-aware</text>
  <text x="1978" y="518" text-anchor="middle" class="tiny">不等于 WATCH 回填事务</text>

  <path d="M405 270 H500" class="line"/><path d="M405 300 H455 V477 H500" class="line"/>
  <path d="M890 275 H1000" class="line"/><path d="M890 477 H950 V305 H1000" class="dash"/>
  <path d="M1300 252 H1430" class="line"/><text x="1340" y="235" class="edge">default</text>
  <path d="M1300 300 H1370 V275 H1830" class="line"/><text x="1760" y="255" class="edge">redis</text>
  <path d="M1588 365 V415" class="line"/><path d="M1978 365 V415" class="line"/>

  <rect x="35" y="630" width="2130" height="485" rx="6" class="band"/>
  <text x="1100" y="670" text-anchor="middle" class="section">读取、回填与写后失效</text>

  <rect x="75" y="720" width="315" height="300" rx="5" class="gray"/>
  <text x="233" y="760" text-anchor="middle" class="label">Cache-Aside 读取</text>
  <text x="105" y="805" class="small">1. GET wrapper</text>
  <text x="105" y="844" class="small">2. 命中：返回 value 或 null</text>
  <text x="105" y="883" class="small">3. miss：登记 cache transaction</text>
  <text x="105" y="922" class="small">4. 查询 PostgreSQL</text>
  <text x="105" y="961" class="small">5. putIfAbsent + CAS commit</text>
  <text x="105" y="997" class="tiny">并发 miss 可重复查询，不是 single-flight</text>

  <rect x="475" y="720" width="330" height="300" rx="5" class="green"/>
  <text x="640" y="760" text-anchor="middle" class="label">Caffeine CAS</text>
  <text x="505" y="805" class="small">newTransactionForKey</text>
  <text x="505" y="844" class="small">DB 查询期间不持锁</text>
  <text x="505" y="883" class="small">put / evict 标记同 key tx failed</text>
  <text x="505" y="922" class="small">commit=false 跳过旧值回填</text>
  <text x="505" y="961" class="small">evictOrPut 实际只 evict</text>
  <text x="505" y="997" class="tiny">只保护当前 JVM</text>

  <rect x="890" y="720" width="350" height="300" rx="5" class="blue"/>
  <text x="1065" y="760" text-anchor="middle" class="label">Redis CAS</text>
  <text x="920" y="805" class="small">GET → WATCH → MULTI</text>
  <text x="920" y="844" class="small">DB 查询 → queue SET with TTL</text>
  <text x="920" y="883" class="small">EXEC null = watched key 冲突</text>
  <text x="920" y="922" class="small">同实体多 key 必须同 hash slot</text>
  <text x="920" y="961" class="small">raw key = cacheName + key.toString()</text>
  <text x="920" y="997" class="tiny">无 DAO cache Pub/Sub</text>

  <rect x="1325" y="720" width="350" height="300" rx="5" class="amber"/>
  <text x="1500" y="760" text-anchor="middle" class="label">PostgreSQL 权威数据</text>
  <text x="1355" y="805" class="small">save / delete 由 Spring 事务提交</text>
  <text x="1355" y="844" class="small">saveAndFlush ≠ COMMIT</text>
  <text x="1355" y="883" class="small">事务内发布本地 ApplicationEvent</text>
  <text x="1355" y="922" class="small">默认监听阶段 AFTER_COMMIT</text>
  <text x="1355" y="961" class="small">无事务时立即调用 handler</text>
  <text x="1355" y="997" class="tiny">DB 与 cache 没有原子提交</text>

  <rect x="1760" y="720" width="365" height="300" rx="5" class="red"/>
  <text x="1943" y="760" text-anchor="middle" class="label">Attributes evictOrPut</text>
  <text x="1790" y="805" class="small">DAO Future success callback</text>
  <text x="1790" y="844" class="small">Caffeine：直接 evict</text>
  <text x="1790" y="883" class="small">Redis：先 DEL</text>
  <text x="1790" y="922" class="small">DEL=0：短 TTL SET 新值</text>
  <text x="1790" y="961" class="small">让 absent watched key 发生变化</text>
  <text x="1790" y="997" class="tiny">阻止并发旧 DB 结果 EXEC 回填</text>

  <path d="M390 870 H475" class="line"/><path d="M390 895 H850 V870 H890" class="line"/>
  <path d="M805 870 H850 V680 H1500 V720" class="line"/><path d="M1240 870 H1325" class="line"/>
  <path d="M1675 870 H1760" class="line"/>

  <rect x="35" y="1150" width="2130" height="360" rx="6" class="band"/>
  <text x="1100" y="1190" text-anchor="middle" class="section">一致性窗口、部署选择与故障边界</text>

  <rect x="75" y="1230" width="390" height="220" rx="5" class="red"/>
  <text x="270" y="1270" text-anchor="middle" class="label">提交与失效窗口</text>
  <text x="105" y="1312" class="small">事务提交前：其他请求仍可能读旧 cache</text>
  <text x="105" y="1348" class="small">COMMIT 后到 evict 前：短暂旧读</text>
  <text x="105" y="1384" class="small">evict 失败：旧 key 留到 TTL</text>
  <text x="105" y="1420" class="tiny">没有 outbox、retry queue 或共同回滚</text>

  <rect x="525" y="1230" width="390" height="220" rx="5" class="green"/>
  <text x="720" y="1270" text-anchor="middle" class="label">Caffeine 部署边界</text>
  <text x="555" y="1312" class="small">单节点：低延迟、无远程依赖</text>
  <text x="555" y="1348" class="small">多节点：每 JVM 可持有不同旧值</text>
  <text x="555" y="1384" class="small">ApplicationEvent 只在发布 JVM</text>
  <text x="555" y="1420" class="tiny">TTL 不是跨节点一致性协议</text>

  <rect x="975" y="1230" width="390" height="220" rx="5" class="blue"/>
  <text x="1170" y="1270" text-anchor="middle" class="label">Redis 部署边界</text>
  <text x="1005" y="1312" class="small">所有节点直接访问共享 key</text>
  <text x="1005" y="1348" class="small">网络、连接池和序列化进入热路径</text>
  <text x="1005" y="1384" class="small">故障异常传播，不自动查 DB</text>
  <text x="1005" y="1420" class="tiny">共享 Redis DB 时需防 raw key 冲突</text>

  <rect x="1425" y="1230" width="700" height="220" rx="5" class="amber"/>
  <text x="1775" y="1270" text-anchor="middle" class="label">生产观测与排障顺序</text>
  <text x="1455" y="1312" class="small">确认具体方法是否使用 cache → 确认实际 cache.type 与条件 Bean</text>
  <text x="1455" y="1348" class="small">区分 cache transaction、Spring DB transaction 与 RedisCacheManager</text>
  <text x="1455" y="1384" class="small">联合检查 DB 值、entry TTL、Redis latency/error、Caffeine heap/GC</text>
  <text x="1455" y="1420" class="tiny">命中率高不代表没有旧读；还要量化 commit-to-evict 与并发 miss</text>

  <path d="M465 1340 H525" class="redline"/><path d="M915 1340 H975" class="line"/><path d="M1365 1340 H1425" class="line"/>
</svg>
