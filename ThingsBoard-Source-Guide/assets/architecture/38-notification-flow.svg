<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1540" viewBox="0 0 2200 1540" role="img" aria-labelledby="title desc">
  <title id="title">ThingsBoard 3.6 Notification 流程架构</title>
  <desc id="desc">展示通知入口、规则处理、请求持久化、收件人和模板解析、六种投递通道、WebSocket、队列、状态、TTL 与生产风险。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1f2937"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#111827;letter-spacing:0}.title{font-size:42px;font-weight:700}.subtitle{font-size:20px;fill:#374151}.section{font-size:27px;font-weight:700}.label{font-size:22px;font-weight:700}.small{font-size:18px}.tiny{font-size:16px;fill:#374151}
      .band{fill:#f8fafc;stroke:#334155;stroke-width:2}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#166534;stroke-width:3}.amber{fill:#fef3c7;stroke:#92400e;stroke-width:3}.red{fill:#fee2e2;stroke:#991b1b;stroke-width:3}.violet{fill:#ede9fe;stroke:#5b21b6;stroke-width:3}.gray{fill:#f3f4f6;stroke:#374151;stroke-width:3}.cyan{fill:#cffafe;stroke:#155e75;stroke-width:3}.line{fill:none;stroke:#1f2937;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#1f2937;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="2200" height="1540" fill="#ffffff"/>
  <text x="1100" y="56" text-anchor="middle" class="title">ThingsBoard 3.6 Notification 流程架构</text>
  <text x="1100" y="90" text-anchor="middle" class="subtitle">入口分类 · Request 编排 · Recipient / Template · Delivery · Persistence / WebSocket / TTL</text>

  <rect x="35" y="120" width="2130" height="260" rx="6" class="band"/>
  <text x="70" y="158" class="section">1. 四类入口与规则路由</text>
  <rect x="75" y="195" width="340" height="135" rx="5" class="blue"/><text x="245" y="230" text-anchor="middle" class="label">REST 手工请求</text><text x="105" y="266" class="small">当前 user 为 originator</text><text x="105" y="296" class="tiny">清空 ruleId / info / status / stats</text>
  <rect x="485" y="195" width="340" height="135" rx="5" class="violet"/><text x="655" y="230" text-anchor="middle" class="label">Notification Rule</text><text x="515" y="266" class="small">12 种 system/domain trigger</text><text x="515" y="296" class="tiny">filter · dedup · limit · escalation</text>
  <rect x="895" y="195" width="340" height="135" rx="5" class="cyan"/><text x="1065" y="230" text-anchor="middle" class="label">Rule Engine 节点</text><text x="925" y="266" class="small">TbMsg data / metadata / type</text><text x="925" y="296" class="tiny">不查询 notification_rule</text>
  <rect x="1305" y="195" width="340" height="135" rx="5" class="gray"/><text x="1475" y="230" text-anchor="middle" class="label">系统 WEB Helper</text><text x="1335" y="266" class="small">临时 platform target</text><text x="1335" y="296" class="tiny">inline template · WEB only</text>
  <rect x="1715" y="195" width="410" height="135" rx="5" class="amber"/><text x="1920" y="230" text-anchor="middle" class="label">TbQueue 远程 trigger</text><text x="1745" y="266" class="small">任一 TB Core notifications topic</text><text x="1745" y="296" class="tiny">consumer ack 早于规则与投递完成</text>

  <rect x="35" y="410" width="2130" height="390" rx="6" class="band"/>
  <text x="70" y="450" class="section">2. DefaultNotificationCenter：一次 request 的实际展开</text>
  <rect x="75" y="495" width="350" height="225" rx="5" class="blue"/><text x="250" y="535" text-anchor="middle" class="label">同步 Preflight</text><text x="105" y="575" class="small">load template / targets</text><text x="105" y="609" class="small">channel.check(tenantId)</text><text x="105" y="643" class="small">manual request rate limit</text><text x="105" y="683" class="tiny">规则请求会跳过不可用 method</text>
  <rect x="500" y="475" width="385" height="265" rx="5" class="amber"/><text x="692" y="515" text-anchor="middle" class="label">notification_request</text><text x="530" y="555" class="small">SCHEDULED / PROCESSING / SENT</text><text x="530" y="589" class="small">targets · template · info</text><text x="530" y="623" class="small">rule/originator · aggregate stats</text><text x="530" y="663" class="tiny">无 FAILED / PARTIAL 状态</text><text x="530" y="698" class="tiny">delay 最大 7 天</text>
  <rect x="960" y="475" width="390" height="265" rx="5" class="violet"/><text x="1155" y="515" text-anchor="middle" class="label">NotificationExecutor</text><text x="990" y="555" class="small">work-stealing pool，默认 10</text><text x="990" y="589" class="small">target → recipient → method</text><text x="990" y="623" class="small">单 request 内顺序遍历</text><text x="990" y="663" class="tiny">规则 / fan-out / scheduled 共享</text><text x="990" y="698" class="tiny">阻塞外部 I/O 会占 pool</text>
  <rect x="1425" y="475" width="330" height="265" rx="5" class="green"/><text x="1590" y="515" text-anchor="middle" class="label">Recipient 解析</text><text x="1455" y="555" class="small">PLATFORM_USERS 分页 256</text><text x="1455" y="589" class="small">Slack conversation</text><text x="1455" y="623" class="small">Teams webhook config</text><text x="1455" y="663" class="tiny">规则 filter 可用 affected info</text><text x="1455" y="698" class="tiny">用户 type/method 偏好</text>
  <rect x="1825" y="475" width="300" height="265" rx="5" class="cyan"/><text x="1975" y="515" text-anchor="middle" class="label">Template 渲染</text><text x="1855" y="555" class="small">info.templateData</text><text x="1855" y="589" class="small">recipient title/email</text><text x="1855" y="623" class="small">firstName/lastName</text><text x="1855" y="663" class="tiny">TemplateUtils 替换</text><text x="1855" y="698" class="tiny">无统一 escaping / redaction</text>
  <path d="M425 608H500" class="line"/><path d="M885 608H960" class="line"/><path d="M1350 608H1425" class="line"/><path d="M1755 608H1825" class="line"/>

  <rect x="35" y="830" width="2130" height="360" rx="6" class="band"/>
  <text x="70" y="870" class="section">3. 六种 delivery method：持久 inbox 与 external-only 的非对称语义</text>
  <rect x="75" y="915" width="315" height="210" rx="5" class="green"/><text x="232" y="955" text-anchor="middle" class="label">WEB</text><text x="105" y="997" class="small">INSERT notification SENT</text><text x="105" y="1032" class="small">SubscriptionManager</text><text x="105" y="1067" class="small">WebSocket unread update</text><text x="105" y="1102" class="tiny">DB commit 在实时更新之前</text>
  <rect x="425" y="895" width="350" height="250" rx="5" class="red"/><text x="600" y="935" text-anchor="middle" class="label">MOBILE_APP</text><text x="455" y="977" class="small">先 INSERT notification SENT</text><text x="455" y="1012" class="small">再查 mobile sessions</text><text x="455" y="1047" class="small">逐 token Firebase send</text><text x="455" y="1082" class="tiny">FCM 失败不回写 notification</text><text x="455" y="1117" class="tiny">invalid token 会删 session</text>
  <rect x="810" y="915" width="280" height="210" rx="5" class="blue"/><text x="950" y="955" text-anchor="middle" class="label">EMAIL</text><text x="840" y="997" class="small">MailService.send</text><text x="840" y="1032" class="small">executor + timeout wait</text><text x="840" y="1067" class="tiny">不写 notification</text><text x="840" y="1102" class="tiny">无 Center retry</text>
  <rect x="1125" y="915" width="280" height="210" rx="5" class="blue"/><text x="1265" y="955" text-anchor="middle" class="label">SMS</text><text x="1155" y="997" class="small">phone validation</text><text x="1155" y="1032" class="small">SmsService.sendSms</text><text x="1155" y="1067" class="tiny">不写 notification</text><text x="1155" y="1102" class="tiny">无 Center retry</text>
  <rect x="1440" y="915" width="280" height="210" rx="5" class="blue"/><text x="1580" y="955" text-anchor="middle" class="label">SLACK</text><text x="1470" y="997" class="small">chat.postMessage</text><text x="1470" y="1032" class="small">检查 response.ok</text><text x="1470" y="1067" class="tiny">不写 notification</text><text x="1470" y="1102" class="tiny">token 存 admin_settings</text>
  <rect x="1755" y="915" width="370" height="210" rx="5" class="blue"/><text x="1940" y="955" text-anchor="middle" class="label">MICROSOFT_TEAMS</text><text x="1785" y="997" class="small">RestTemplate POST webhook</text><text x="1785" y="1032" class="small">connect/read 各 15 秒</text><text x="1785" y="1067" class="tiny">不写 notification</text><text x="1785" y="1102" class="tiny">空 check() 不验证 webhook</text>

  <rect x="35" y="1220" width="2130" height="275" rx="6" class="band"/>
  <text x="70" y="1260" class="section">4. 持久化、恢复、TTL 与生产风险</text>
  <rect x="75" y="1300" width="440" height="145" rx="5" class="green"/><text x="295" y="1337" text-anchor="middle" class="label">PostgreSQL</text><text x="105" y="1377" class="small">config/request：JPA regular tables</text><text x="105" y="1408" class="small">notification：RANGE(created_time)</text><text x="105" y="1437" class="tiny">无 per-recipient 唯一键；request/recipient 无 FK</text>
  <rect x="565" y="1300" width="440" height="145" rx="5" class="amber"/><text x="785" y="1337" text-anchor="middle" class="label">Scheduler / Queue</text><text x="595" y="1377" class="small">SCHEDULED 行 + JVM ScheduledFuture</text><text x="595" y="1408" class="small">分区接管时扫描恢复</text><text x="595" y="1437" class="tiny">queue ack 与 provider delivery 不同事务</text>
  <rect x="1055" y="1300" width="440" height="145" rx="5" class="violet"/><text x="1275" y="1337" text-anchor="middle" class="label">TTL</text><text x="1085" y="1377" class="small">默认 30 天 · 168h 分区 · 每日检查</text><text x="1085" y="1408" class="small">先 drop notification，再删旧 request</text><text x="1085" y="1437" class="tiny">rule/template/target/settings 不在此 TTL</text>
  <rect x="1545" y="1280" width="580" height="185" rx="5" class="red"/><text x="1835" y="1317" text-anchor="middle" class="label">必须监控的风险与缺口</text><text x="1575" y="1357" class="small">部分成功 · 无统一 retry/DLQ · request SENT ≠ delivered</text><text x="1575" y="1388" class="small">pool saturation · PROCESSING stuck · provider latency/error</text><text x="1575" y="1419" class="small">tokens/credentials/TbMsg/template/stats 敏感数据</text><text x="1575" y="1450" class="tiny">缺 attempt/receipt/backlog/end-to-end trace 与 durable idempotency key</text>

  <path d="M655 330V370H692V475" class="dash"/><path d="M1065 330V390H800V475" class="dash"/><path d="M1475 330V390H830V475" class="dash"/><path d="M1920 330V390H900V475" class="dash"/>
  <path d="M1155 740V790H232V915" class="line"/><path d="M1155 790H600V895" class="line"/><path d="M1155 790H950V915" class="line"/><path d="M1155 790H1265V915" class="line"/><path d="M1155 790H1580V915" class="line"/><path d="M1155 790H1940V915" class="line"/>
</svg>
