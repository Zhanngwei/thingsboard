<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1360" viewBox="0 0 1900 1360" role="img" aria-labelledby="title desc">
  <title id="title">ThingsBoard 3.6 Session 与 Device State 架构</title>
  <desc id="desc">高对比展示 Transport 本地会话、Core Queue 分区、Device Actor 会话快照、Device State 活动状态、持久化和三类超时边界。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/>
    </marker>
    <style>
      .title{font:700 34px Arial,'Microsoft YaHei',sans-serif;fill:#111827}
      .subtitle{font:600 17px Arial,'Microsoft YaHei',sans-serif;fill:#374151}
      .section{font:700 22px Arial,'Microsoft YaHei',sans-serif;fill:#111827}
      .label{font:700 18px Arial,'Microsoft YaHei',sans-serif;fill:#111827}
      .small{font:15px Arial,'Microsoft YaHei',sans-serif;fill:#111827}
      .tiny{font:14px Arial,'Microsoft YaHei',sans-serif;fill:#111827}
      .edge{font:700 14px Arial,'Microsoft YaHei',sans-serif;fill:#111827;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}
      .band{fill:#f8fafc;stroke:#334155;stroke-width:2.5}
      .blue{fill:#e8f4fd;stroke:#0369a1;stroke-width:3}
      .green{fill:#ecfdf5;stroke:#047857;stroke-width:3}
      .amber{fill:#fff7e6;stroke:#a16207;stroke-width:3}
      .red{fill:#fff1f2;stroke:#be123c;stroke-width:3}
      .gray{fill:#f3f4f6;stroke:#374151;stroke-width:3}
      .violet{fill:#f5f3ff;stroke:#6d28d9;stroke-width:3}
      .line{fill:none;stroke:#1f2937;stroke-width:3;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#475569;stroke-width:2.6;stroke-dasharray:9 7;marker-end:url(#arrow)}
      .redline{fill:none;stroke:#b91c1c;stroke-width:3;stroke-dasharray:10 7;marker-end:url(#arrow-red)}
    </style>
  </defs>

  <rect width="1900" height="1360" fill="#ffffff"/>
  <text id="diagram-title" x="950" y="48" text-anchor="middle" class="title">ThingsBoard 3.6 Session 与 Device State：三层会话、两种状态、四个确认边界</text>
  <text x="950" y="78" text-anchor="middle" class="subtitle">源码事实：register/deregister 仅作用于 Transport 本地；OPEN/CLOSED 必须显式进入 Core Queue；active 不等于 socket online</text>

  <rect x="30" y="105" width="435" height="940" rx="6" class="band"/>
  <text x="247" y="142" text-anchor="middle" class="section">协议与 Transport 进程</text>

  <rect x="70" y="175" width="355" height="120" rx="5" class="blue"/>
  <text x="247" y="211" text-anchor="middle" class="label">Protocol Handler</text>
  <text x="247" y="241" text-anchor="middle" class="small">MQTT / CoAP / HTTP / LwM2M / Gateway</text>
  <text x="247" y="269" text-anchor="middle" class="small">认证后创建随机 session UUID</text>

  <rect x="70" y="335" width="355" height="190" rx="5" class="green"/>
  <text x="247" y="371" text-anchor="middle" class="label">DefaultTransportService.sessions</text>
  <text x="247" y="403" text-anchor="middle" class="small">UUID → SessionMetaData</text>
  <text x="247" y="431" text-anchor="middle" class="small">listener / SYNC 或 ASYNC / timer</text>
  <text x="247" y="459" text-anchor="middle" class="small">attribute 与 RPC subscription flags</text>
  <text x="247" y="487" text-anchor="middle" class="small">仅当前 Transport 实例内存</text>

  <rect x="70" y="565" width="355" height="190" rx="5" class="amber"/>
  <text x="247" y="601" text-anchor="middle" class="label">AbstractActivityManager.states</text>
  <text x="247" y="633" text-anchor="middle" class="small">sessionId → lastRecorded / lastReported</text>
  <text x="247" y="661" text-anchor="middle" class="small">默认 LAST 策略，每 3000 ms 聚合</text>
  <text x="247" y="689" text-anchor="middle" class="small">无本地 session 仍报告最后 activity</text>
  <text x="247" y="717" text-anchor="middle" class="small">gateway 可覆盖子设备 activity time</text>

  <rect x="70" y="795" width="355" height="195" rx="5" class="red"/>
  <text x="247" y="831" text-anchor="middle" class="label">Transport 生命周期边界</text>
  <text x="247" y="863" text-anchor="middle" class="small">register ≠ OPEN</text>
  <text x="247" y="891" text-anchor="middle" class="small">deregister ≠ CLOSED</text>
  <text x="247" y="919" text-anchor="middle" class="small">SYNC response / timer 后本地销毁</text>
  <text x="247" y="947" text-anchor="middle" class="small">进程重启丢失 listener、socket、activity</text>

  <rect x="500" y="105" width="400" height="940" rx="6" class="band"/>
  <text x="700" y="142" text-anchor="middle" class="section">Queue 路由与确认</text>

  <rect x="540" y="175" width="320" height="155" rx="5" class="blue"/>
  <text x="700" y="211" text-anchor="middle" class="label">SessionInfoProto</text>
  <text x="700" y="243" text-anchor="middle" class="small">nodeId + sessionId</text>
  <text x="700" y="271" text-anchor="middle" class="small">tenant / device / customer / profile ids</text>
  <text x="700" y="299" text-anchor="middle" class="small">gateway session id 可选</text>

  <rect x="540" y="370" width="320" height="220" rx="5" class="green"/>
  <text x="700" y="406" text-anchor="middle" class="label">Core Queue</text>
  <text x="700" y="438" text-anchor="middle" class="small">ToCoreMsg.toDeviceActorMsg</text>
  <text x="700" y="466" text-anchor="middle" class="small">SessionEvent OPEN / CLOSED</text>
  <text x="700" y="494" text-anchor="middle" class="small">SubscriptionInfo lastActivityTime</text>
  <text x="700" y="522" text-anchor="middle" class="small">默认逻辑 topic：tb_core.0 … tb_core.9</text>
  <text x="700" y="550" text-anchor="middle" class="small">device UUID 经 murmur3_128 稳定路由</text>

  <rect x="540" y="630" width="320" height="170" rx="5" class="amber"/>
  <text x="700" y="666" text-anchor="middle" class="label">Kafka 默认语义</text>
  <text x="700" y="698" text-anchor="middle" class="small">producer acks=all / retries=1</text>
  <text x="700" y="726" text-anchor="middle" class="small">consumer group：tb-core-node</text>
  <text x="700" y="754" text-anchor="middle" class="small">auto commit=false，pack 后 commitSync</text>

  <rect x="540" y="840" width="320" height="150" rx="5" class="red"/>
  <text x="700" y="876" text-anchor="middle" class="label">确认不是事务</text>
  <text x="700" y="908" text-anchor="middle" class="small">producer success ≠ Actor success</text>
  <text x="700" y="936" text-anchor="middle" class="small">Core commit ≠ 状态 DB save</text>
  <text x="700" y="964" text-anchor="middle" class="small">失败不跨层回滚</text>

  <rect x="935" y="105" width="435" height="940" rx="6" class="band"/>
  <text x="1152" y="142" text-anchor="middle" class="section">Device Actor 会话管理</text>

  <rect x="975" y="175" width="355" height="235" rx="5" class="blue"/>
  <text x="1152" y="211" text-anchor="middle" class="label">DeviceActorMessageProcessor</text>
  <text x="1152" y="243" text-anchor="middle" class="small">sessions：插入顺序 + 最老淘汰</text>
  <text x="1152" y="271" text-anchor="middle" class="small">attributeSubscriptions / rpcSubscriptions</text>
  <text x="1152" y="299" text-anchor="middle" class="small">默认每设备 max sessions = 1</text>
  <text x="1152" y="327" text-anchor="middle" class="small">第一条 OPEN → onDeviceConnect</text>
  <text x="1152" y="355" text-anchor="middle" class="small">最后一条 CLOSED → onDeviceDisconnect</text>
  <text x="1152" y="383" text-anchor="middle" class="small">每条新 OPEN / activity report → activity</text>

  <rect x="975" y="450" width="355" height="180" rx="5" class="green"/>
  <text x="1152" y="486" text-anchor="middle" class="label">Device Session Cache</text>
  <text x="1152" y="518" text-anchor="middle" class="small">Caffeine 默认：restore/dump 直接跳过</text>
  <text x="1152" y="546" text-anchor="middle" class="small">Redis：DeviceSessionsCacheEntry protobuf</text>
  <text x="1152" y="574" text-anchor="middle" class="small">只存 ASYNC nodeId、activity、订阅</text>
  <text x="1152" y="602" text-anchor="middle" class="small">快照不能恢复真实网络 channel</text>

  <rect x="975" y="670" width="355" height="150" rx="5" class="amber"/>
  <text x="1152" y="706" text-anchor="middle" class="label">Actor timeout 兜底</text>
  <text x="1152" y="738" text-anchor="middle" class="small">AppActor 每 3000 ms 广播检查</text>
  <text x="1152" y="766" text-anchor="middle" class="small">删除 stale session 与订阅</text>
  <text x="1152" y="794" text-anchor="middle" class="small">不补发 DISCONNECT_EVENT</text>

  <rect x="975" y="860" width="355" height="130" rx="5" class="gray"/>
  <text x="1152" y="896" text-anchor="middle" class="label">下行返回</text>
  <text x="1152" y="928" text-anchor="middle" class="small">nodeId → per-service notification topic</text>
  <text x="1152" y="956" text-anchor="middle" class="small">sessionId → Transport listener</text>

  <rect x="1405" y="105" width="465" height="940" rx="6" class="band"/>
  <text x="1637" y="142" text-anchor="middle" class="section">Device State 与持久化</text>

  <rect x="1445" y="175" width="385" height="235" rx="5" class="violet"/>
  <text x="1637" y="211" text-anchor="middle" class="label">DefaultDeviceStateService.deviceStates</text>
  <text x="1637" y="243" text-anchor="middle" class="small">只缓存当前 TB_CORE owner 的设备</text>
  <text x="1637" y="271" text-anchor="middle" class="small">active boolean</text>
  <text x="1637" y="299" text-anchor="middle" class="small">lastConnectTime / lastActivityTime</text>
  <text x="1637" y="327" text-anchor="middle" class="small">lastDisconnectTime / inactivityAlarmTime</text>
  <text x="1637" y="355" text-anchor="middle" class="small">inactivityTimeout 毫秒</text>
  <text x="1637" y="383" text-anchor="middle" class="small">active 公式与 socket 是否存在无关</text>

  <rect x="1445" y="450" width="385" height="175" rx="5" class="green"/>
  <text x="1637" y="486" text-anchor="middle" class="label">默认 Attribute 模式</text>
  <text x="1637" y="518" text-anchor="middle" class="small">state.persistToTelemetry=false</text>
  <text x="1637" y="546" text-anchor="middle" class="small">attribute_kv / SERVER_SCOPE</text>
  <text x="1637" y="574" text-anchor="middle" class="small">device_info_active_attribute_view</text>
  <text x="1637" y="602" text-anchor="middle" class="small">六个 key 独立异步保存</text>

  <rect x="1445" y="665" width="385" height="155" rx="5" class="blue"/>
  <text x="1637" y="701" text-anchor="middle" class="label">可选 Telemetry 模式</text>
  <text x="1637" y="733" text-anchor="middle" class="small">ts_kv history + ts_kv_latest</text>
  <text x="1637" y="761" text-anchor="middle" class="small">state.telemetryTtl 默认 0</text>
  <text x="1637" y="789" text-anchor="middle" class="small">切换后需重建 device_info_view</text>

  <rect x="1445" y="860" width="385" height="130" rx="5" class="red"/>
  <text x="1637" y="896" text-anchor="middle" class="label">Rule Engine 与通知</text>
  <text x="1637" y="928" text-anchor="middle" class="small">CONNECT / DISCONNECT</text>
  <text x="1637" y="956" text-anchor="middle" class="small">ACTIVITY / INACTIVITY + trigger</text>

  <path d="M425 235 H540" class="line"/>
  <text x="482" y="220" text-anchor="middle" class="edge">SessionInfo</text>
  <path d="M425 430 H540" class="line"/>
  <text x="482" y="415" text-anchor="middle" class="edge">OPEN / CLOSED</text>
  <path d="M425 660 H540" class="line"/>
  <text x="482" y="645" text-anchor="middle" class="edge">activity report</text>
  <path d="M860 480 H975" class="line"/>
  <text x="917" y="465" text-anchor="middle" class="edge">consume</text>
  <path d="M1330 292 H1445" class="line"/>
  <text x="1387" y="277" text-anchor="middle" class="edge">state calls</text>
  <path d="M1330 540 H1445" class="dash"/>
  <text x="1387" y="525" text-anchor="middle" class="edge">partition restore</text>
  <path d="M975 925 H860" class="line"/>
  <text x="917" y="910" text-anchor="middle" class="edge">notification</text>
  <path d="M540 925 H425" class="line"/>
  <text x="482" y="910" text-anchor="middle" class="edge">listener</text>

  <rect x="30" y="1080" width="1840" height="235" rx="6" class="gray"/>
  <text x="950" y="1118" text-anchor="middle" class="section">三类时间窗口与合法状态组合</text>

  <rect x="70" y="1150" width="520" height="120" rx="5" class="amber"/>
  <text x="330" y="1184" text-anchor="middle" class="label">Session inactivity</text>
  <text x="330" y="1216" text-anchor="middle" class="small">默认 600000 ms；Transport 关闭真实 listener</text>
  <text x="330" y="1244" text-anchor="middle" class="small">Actor 同阈值兜底清理 stale snapshot</text>

  <rect x="690" y="1150" width="520" height="120" rx="5" class="violet"/>
  <text x="950" y="1184" text-anchor="middle" class="label">Device inactivity</text>
  <text x="950" y="1216" text-anchor="middle" class="small">默认 600 s；now ≥ lastActivity + timeout</text>
  <text x="950" y="1244" text-anchor="middle" class="small">每 60 s fixed-delay 扫描并写 active=false</text>

  <rect x="1310" y="1150" width="520" height="120" rx="5" class="red"/>
  <text x="1570" y="1184" text-anchor="middle" class="label">连接态 ≠ 活动态</text>
  <text x="1570" y="1216" text-anchor="middle" class="small">无 session 但 recent activity：active=true 合法</text>
  <text x="1570" y="1244" text-anchor="middle" class="small">session 尚在但 report 中断：active=false 也合法</text>

  <path d="M590 1210 H690" class="redline"/>
  <path d="M1210 1210 H1310" class="redline"/>

  <text x="950" y="1335" text-anchor="middle" class="subtitle">排障顺序：协议 activity → Transport producer → tb_core.&lt;n&gt; lag / owner → Device Actor maps → Device State save → attribute_kv 或 ts_kv_latest → device_info_view</text>
</svg>
