<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1580" viewBox="0 0 2200 1580" role="img" aria-labelledby="title desc">
  <title id="title">ThingsBoard 3.6 Relation 架构与流程</title><desc id="desc">展示关系有向复合键、缓存、同步异步写入、Java递归、SQL递归和外围事件。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1f2937"/></marker><style>
  text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#111827;letter-spacing:0}.title{font-size:42px;font-weight:700}.subtitle{font-size:20px;fill:#374151}.section{font-size:28px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:19px}.tiny{font-size:17px;fill:#374151}
  .band{fill:#f8fafc;stroke:#334155;stroke-width:2}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#166534;stroke-width:3}.amber{fill:#fef3c7;stroke:#92400e;stroke-width:3}.red{fill:#fee2e2;stroke:#991b1b;stroke-width:3}.violet{fill:#ede9fe;stroke:#5b21b6;stroke-width:3}.gray{fill:#f3f4f6;stroke:#374151;stroke-width:3}.line{fill:none;stroke:#1f2937;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#1f2937;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#a)}
  </style></defs><rect width="2200" height="1580" fill="#fff"/>
  <text x="1100" y="58" text-anchor="middle" class="title">ThingsBoard 3.6 Relation 架构与流程</text><text x="1100" y="92" text-anchor="middle" class="subtitle">Directed Edge · Six-column Primary Key · Cache-Aside · Java BFS · Recursive CTE · Event Side Effects</text>

  <rect x="35" y="125" width="2130" height="405" rx="6" class="band"/><text x="1100" y="165" text-anchor="middle" class="section">有向边模型与写入链</text>
  <rect x="75" y="210" width="320" height="230" rx="5" class="gray"/><text x="235" y="250" text-anchor="middle" class="label">REST / Application</text><text x="105" y="292" class="small">save / delete / get / list</text><text x="105" y="329" class="small">两端 WRITE/READ 权限</text><text x="105" y="366" class="small">typeGroup 默认 COMMON</text><text x="105" y="403" class="tiny">非法 group 被静默回退</text>
  <rect x="480" y="190" width="360" height="270" rx="5" class="blue"/><text x="660" y="230" text-anchor="middle" class="label">BaseRelationService</text><text x="510" y="274" class="small">同步 / 异步 API</text><text x="510" y="311" class="small">RelationCache read / evict</text><text x="510" y="348" class="small">EntityRelationEvent AFTER_COMMIT</text><text x="510" y="385" class="small">RelationActionEvent for Edge</text><text x="510" y="422" class="tiny">service 本身不定义总外层事务</text>
  <rect x="925" y="190" width="360" height="270" rx="5" class="green"/><text x="1105" y="230" text-anchor="middle" class="label">DAO / Repository</text><text x="955" y="274" class="small">JpaRelationDao</text><text x="955" y="311" class="small">SqlRelationInsertRepository</text><text x="955" y="348" class="small">ON CONFLICT DO UPDATE additionalInfo</text><text x="955" y="385" class="small">RelationRepository derived queries</text><text x="955" y="422" class="tiny">async 通过 JPA listening executor</text>
  <rect x="1370" y="190" width="360" height="270" rx="5" class="amber"/><text x="1550" y="230" text-anchor="middle" class="label">PostgreSQL relation</text><text x="1400" y="274" class="small">from_id / from_type</text><text x="1400" y="311" class="small">type_group / type</text><text x="1400" y="348" class="small">to_id / to_type</text><text x="1400" y="385" class="small">additional_info</text><text x="1400" y="422" class="tiny">无 tenant_id / FK / version / timestamp</text>
  <rect x="1815" y="210" width="300" height="230" rx="5" class="violet"/><text x="1965" y="250" text-anchor="middle" class="label">外围副作用</text><text x="1845" y="292" class="small">Edge notification</text><text x="1845" y="329" class="small">async Audit Log</text><text x="1845" y="366" class="small">Rule Engine action queue</text><text x="1845" y="403" class="tiny">均非 relation DB 原子提交</text>
  <path d="M395 325H480" class="line"/><path d="M840 325H925" class="line"/><path d="M1285 325H1370" class="line"/><path d="M1730 325H1815" class="dash"/>

  <rect x="35" y="565" width="2130" height="500" rx="6" class="band"/><text x="1100" y="605" text-anchor="middle" class="section">三套查询机制必须分开</text>
  <rect x="75" y="665" width="600" height="310" rx="5" class="green"/><text x="375" y="705" text-anchor="middle" class="label">1. 精确与普通列表：Cache-Aside</text><text x="105" y="750" class="small">精确 key：from/to/type/typeGroup，不含 tenantId</text><text x="105" y="787" class="small">列表 key：FROM 或 TO + optional relationType</text><text x="105" y="824" class="small">single null 不负缓存；empty List 会缓存</text><text x="105" y="861" class="small">Caffeine 默认 / Redis 可选</text><text x="105" y="898" class="small">写后清 exact + from/to list key</text><text x="105" y="935" class="tiny">多节点 Caffeine 一致性边界见第 32 章</text>
  <rect x="800" y="645" width="600" height="350" rx="5" class="blue"/><text x="1100" y="685" text-anchor="middle" class="label">2. EntityRelationsQuery：Java BFS</text><text x="830" y="730" class="small">JpaRelationQueryExecutorService：默认 4 threads</text><text x="830" y="767" class="small">每层调用 from/to list DAO；visited entityId 防环</text><text x="830" y="804" class="small">maxLevel &lt;= 0 → effectively unlimited</text><text x="830" y="841" class="small">Future timeout 默认 20s，不取消 DB statement</text><text x="830" y="878" class="small">relation/entity filters 在完整遍历后应用</text><text x="830" y="915" class="small">last level 还包含提前叶子末边</text><text x="830" y="952" class="tiny">过滤不剪枝，图大时读放大</text>
  <rect x="1525" y="665" width="590" height="310" rx="5" class="violet"/><text x="1820" y="705" text-anchor="middle" class="label">3. RelationsQueryFilter：SQL CTE</text><text x="1555" y="750" class="small">DefaultEntityQueryRepository 动态 SQL</text><text x="1555" y="787" class="small">WITH RECURSIVE + UUID path 防环</text><text x="1555" y="824" class="small">只遍历 COMMON；FROM / TO 模板</text><text x="1555" y="861" class="small">effective maxLevel 上限默认 50</text><text x="1555" y="898" class="small">再 join entity/latest/attributes 和分页</text><text x="1555" y="935" class="tiny">不是 BaseRelationService Java BFS</text>
  <path d="M675 820H800" class="line"/><path d="M1400 820H1525" class="line"/>

  <rect x="35" y="1100" width="2130" height="425" rx="6" class="band"/><text x="1100" y="1140" text-anchor="middle" class="section">事务、删除联动与生产风险</text>
  <rect x="75" y="1190" width="390" height="265" rx="5" class="amber"/><text x="270" y="1230" text-anchor="middle" class="label">实体删除</text><text x="105" y="1273" class="small">服务显式预读入边/出边</text><text x="105" y="1310" class="small">批量 DELETE 两个方向</text><text x="105" y="1347" class="small">逐边发布 cache evict</text><text x="105" y="1384" class="small">不发布 RelationActionEvent</text><text x="105" y="1421" class="tiny">数据库没有 endpoint FK cascade</text>
  <rect x="525" y="1190" width="390" height="265" rx="5" class="red"/><text x="720" y="1230" text-anchor="middle" class="label">异步与删除竞态</text><text x="555" y="1273" class="small">Future listener 不读取结果</text><text x="555" y="1310" class="small">失败仍可 evict / 发 Edge event</text><text x="555" y="1347" class="small">existsById → deleteById TOCTOU</text><text x="555" y="1384" class="small">delete exception 可被吞掉并返回 true</text><text x="555" y="1421" class="tiny">REST 200 与真实删除可分叉</text>
  <rect x="975" y="1190" width="390" height="265" rx="5" class="violet"/><text x="1170" y="1230" text-anchor="middle" class="label">租户与权限边界</text><text x="1005" y="1273" class="small">表/DAO/cache key 无 tenantId</text><text x="1005" y="1310" class="small">依赖 UUID 全局唯一与上层权限</text><text x="1005" y="1347" class="small">内部调用可创建孤儿边</text><text x="1005" y="1384" class="small">REST 无权边静默过滤</text><text x="1005" y="1421" class="tiny">列表可能是部分结果且不提示</text>
  <rect x="1425" y="1190" width="690" height="265" rx="5" class="blue"/><text x="1770" y="1230" text-anchor="middle" class="label">生产观测与调优</text><text x="1455" y="1273" class="small">按 from/to 两个辅助索引观察 rows、latency、cache hit/miss</text><text x="1455" y="1310" class="small">限制 Java BFS maxLevel，避免“0 = 无界”的误解</text><text x="1455" y="1347" class="small">分开监控 JPA executor、relation query executor 和 Hikari</text><text x="1455" y="1384" class="small">核对 DB row、cache event、Edge、audit、Rule Engine 各自确认点</text><text x="1455" y="1421" class="tiny">Actor/Kafka 只参与成功后的业务消息，不参与 relation upsert</text>
  <path d="M465 1325H525" class="line"/><path d="M915 1325H975" class="line"/><path d="M1365 1325H1425" class="line"/>
</svg>
