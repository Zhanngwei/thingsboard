<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1580" viewBox="0 0 2200 1580" role="img" aria-labelledby="title desc">
  <title id="title">ThingsBoard 3.6 Event 与 Audit Log 双链架构</title><desc id="desc">展示 Debug Event 和 Audit Log 的独立入口、队列、事务、表、查询、TTL 和风险。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1f2937"/></marker><style>
  text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#111827;letter-spacing:0}.title{font-size:42px;font-weight:700}.subtitle{font-size:20px;fill:#374151}.section{font-size:28px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:19px}.tiny{font-size:17px;fill:#374151}
  .band{fill:#f8fafc;stroke:#334155;stroke-width:2}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#166534;stroke-width:3}.amber{fill:#fef3c7;stroke:#92400e;stroke-width:3}.red{fill:#fee2e2;stroke:#991b1b;stroke-width:3}.violet{fill:#ede9fe;stroke:#5b21b6;stroke-width:3}.gray{fill:#f3f4f6;stroke:#374151;stroke-width:3}.line{fill:none;stroke:#1f2937;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#1f2937;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#a)}
  </style></defs><rect width="2200" height="1580" fill="#fff"/>
  <text x="1100" y="58" text-anchor="middle" class="title">ThingsBoard 3.6 Event 与 Audit Log 双链架构</text><text x="1100" y="92" text-anchor="middle" class="subtitle">Independent Producers · Independent Executors · Independent Transactions · Partition TTL</text>

  <rect x="35" y="125" width="1040" height="915" rx="6" class="band"/><text x="555" y="165" text-anchor="middle" class="section">Debug Event：Rule Actor 的异步诊断记录</text>
  <rect x="75" y="215" width="280" height="190" rx="5" class="violet"/><text x="215" y="255" text-anchor="middle" class="label">Rule Actor</text><text x="105" y="298" class="small">RuleNode input</text><text x="105" y="335" class="small">next/output/failure/ack</text><text x="105" y="372" class="tiny">debug mode 与租户限流</text>
  <rect x="435" y="215" width="280" height="190" rx="5" class="blue"/><text x="575" y="255" text-anchor="middle" class="label">ActorSystemContext</text><text x="465" y="298" class="small">persistDebugAsync</text><text x="465" y="335" class="small">原始 data/metadata/error</text><text x="465" y="372" class="tiny">构造 RuleNode/Chain event</text>
  <rect x="795" y="215" width="240" height="190" rx="5" class="green"/><text x="915" y="255" text-anchor="middle" class="label">EventService</text><text x="825" y="298" class="small">validate</text><text x="825" y="335" class="small">每字段截断 4096</text><text x="825" y="372" class="tiny">不做统一脱敏</text>
  <path d="M355 310H435" class="line"/><path d="M715 310H795" class="line"/>
  <rect x="75" y="485" width="280" height="210" rx="5" class="amber"/><text x="215" y="525" text-anchor="middle" class="label">JpaBaseEventDao</text><text x="105" y="568" class="small">time UUID</text><text x="105" y="605" class="small">range partition create</text><text x="105" y="642" class="small">EventType routing</text><text x="105" y="679" class="tiny">异步 future</text>
  <rect x="435" y="465" width="280" height="250" rx="5" class="red"/><text x="575" y="505" text-anchor="middle" class="label">TbSqlBlockingQueue</text><text x="465" y="548" class="small">无界 LinkedBlockingQueue</text><text x="465" y="585" class="small">pack by size/time</text><text x="465" y="622" class="small">shutdownNow 无 drain</text><text x="465" y="659" class="small">batch fail → all futures fail</text><text x="465" y="696" class="tiny">无持久 retry / DLQ</text>
  <rect x="795" y="485" width="240" height="210" rx="5" class="amber"/><text x="915" y="525" text-anchor="middle" class="label">EventInsertRepo</text><text x="825" y="568" class="small">TransactionTemplate</text><text x="825" y="605" class="small">per-type JDBC batch</text><text x="825" y="642" class="small">单 pack transaction</text><text x="825" y="679" class="tiny">与 Actor 无共同事务</text>
  <path d="M915 405V445H215V485" class="line"/><path d="M355 590H435" class="line"/><path d="M715 590H795" class="line"/>
  <rect x="75" y="785" width="960" height="190" rx="5" class="green"/><text x="555" y="825" text-anchor="middle" class="label">PostgreSQL EventType 分区表</text><text x="105" y="868" class="small">error_event · lc_event · stats_event · rule_node_debug_event · rule_chain_debug_event</text><text x="105" y="905" class="small">PARTITION BY RANGE(ts)；debug 默认 1h partition，普通 event 默认 168h</text><text x="105" y="942" class="tiny">默认 event TTL=0；debug TTL=604800s；SYS owner 每小时按整分区删除</text><path d="M915 695V785" class="line"/>

  <rect x="1125" y="125" width="1040" height="915" rx="6" class="band"/><text x="1645" y="165" text-anchor="middle" class="section">Audit Log：业务动作后的独立审计</text>
  <rect x="1165" y="215" width="280" height="190" rx="5" class="gray"/><text x="1305" y="255" text-anchor="middle" class="label">Business / REST</text><text x="1195" y="298" class="small">CRUD / login / RPC / OTA</text><text x="1195" y="335" class="small">success or failure action</text><text x="1195" y="372" class="tiny">业务事务先按自身语义执行</text>
  <rect x="1525" y="215" width="280" height="190" rx="5" class="blue"/><text x="1665" y="255" text-anchor="middle" class="label">EntityActionService</text><text x="1555" y="298" class="small">action type / entity snapshot</text><text x="1555" y="335" class="small">Rule Engine action side path</text><text x="1555" y="372" class="tiny">调用方忽略 audit future</text>
  <rect x="1885" y="215" width="240" height="190" rx="5" class="violet"/><text x="2005" y="255" text-anchor="middle" class="label">AuditLogService</text><text x="1915" y="298" class="small">level filtering</text><text x="1915" y="335" class="small">actionData / status</text><text x="1915" y="372" class="tiny">完整 failure stack</text>
  <path d="M1445 310H1525" class="line"/><path d="M1805 310H1885" class="line"/>
  <rect x="1165" y="485" width="280" height="210" rx="5" class="red"/><text x="1305" y="525" text-anchor="middle" class="label">JpaExecutorService</text><text x="1195" y="568" class="small">work-stealing pool</text><text x="1195" y="605" class="small">size derived from Hikari max</text><text x="1195" y="642" class="small">business thread does not wait</text><text x="1195" y="679" class="tiny">失败不改变业务响应</text>
  <rect x="1525" y="485" width="280" height="210" rx="5" class="amber"/><text x="1665" y="525" text-anchor="middle" class="label">JpaAuditLogDao</text><text x="1555" y="568" class="small">partition create</text><text x="1555" y="605" class="small">EntityManager.persist</text><text x="1555" y="642" class="small">独立 @Transactional</text><text x="1555" y="679" class="tiny">无业务实体外键</text>
  <rect x="1885" y="485" width="240" height="210" rx="5" class="green"/><text x="2005" y="525" text-anchor="middle" class="label">AuditLogSink</text><text x="1915" y="568" class="small">Dummy / Elasticsearch</text><text x="1915" y="605" class="small">DB commit 后调用</text><text x="1915" y="642" class="small">失败仅 warning</text><text x="1915" y="679" class="tiny">无 retry / rollback</text>
  <path d="M2005 405V445H1305V485" class="line"/><path d="M1445 590H1525" class="line"/><path d="M1805 590H1885" class="line"/>
  <rect x="1165" y="785" width="960" height="190" rx="5" class="green"/><text x="1645" y="825" text-anchor="middle" class="label">PostgreSQL audit_log</text><text x="1195" y="868" class="small">tenant/customer/entity/user snapshots · action_type/data/status/failure_details</text><text x="1195" y="905" class="small">PARTITION BY RANGE(created_time)；无 tenant/customer/user/entity foreign keys</text><text x="1195" y="942" class="tiny">默认 TTL=0 永久保留；启用后 SYS owner 每日按整分区清理；offset pagination</text><path d="M1665 695V785" class="line"/>

  <rect x="35" y="1080" width="2130" height="445" rx="6" class="band"/><text x="1100" y="1120" text-anchor="middle" class="section">查询、传播边界与生产风险</text>
  <rect x="75" y="1170" width="390" height="285" rx="5" class="blue"/><text x="270" y="1210" text-anchor="middle" class="label">读取入口</text><text x="105" y="1253" class="small">EventController：类型/Filter/clear</text><text x="105" y="1290" class="small">RuleChainController：latest debug input</text><text x="105" y="1327" class="small">AuditLogController：tenant/user/entity/customer</text><text x="105" y="1364" class="small">时间范围均为闭区间</text><text x="105" y="1401" class="tiny">UI 走 REST，不走 WebSocket</text>
  <rect x="525" y="1170" width="390" height="285" rx="5" class="violet"/><text x="720" y="1210" text-anchor="middle" class="label">不参与同一事务</text><text x="555" y="1253" class="small">业务实体 save/delete</text><text x="555" y="1290" class="small">Rule Engine Actor/message</text><text x="555" y="1327" class="small">Edge Event / edge_event</text><text x="555" y="1364" class="small">Kafka/TbQueue side messages</text><text x="555" y="1401" class="tiny">Event/Audit 也没有 Cassandra 实现</text>
  <rect x="975" y="1170" width="390" height="285" rx="5" class="red"/><text x="1170" y="1210" text-anchor="middle" class="label">敏感数据风险</text><text x="1005" y="1253" class="small">debug 原始 data/metadata/error</text><text x="1005" y="1290" class="small">audit credentials/RPC/telemetry/entity</text><text x="1005" y="1327" class="small">failure_details 完整 stack trace</text><text x="1005" y="1364" class="small">仅 Dashboard config 特殊清空</text><text x="1005" y="1401" class="tiny">字段截断不是 secret redaction</text>
  <rect x="1425" y="1170" width="690" height="285" rx="5" class="amber"/><text x="1770" y="1210" text-anchor="middle" class="label">生产观测</text><text x="1455" y="1253" class="small">Event queue depth/pack latency/failures、partition create、heap growth</text><text x="1455" y="1290" class="small">Audit executor backlog/Hikari wait/DB failures/sink failures</text><text x="1455" y="1327" class="small">分开统计业务成功、audit commit、debug commit、Rule Engine queue ack</text><text x="1455" y="1364" class="small">TTL 实际保留期包含 partition interval + scheduler interval</text><text x="1455" y="1401" class="tiny">关闭流程必须关注 Event queue 未 drain 的记录丢失窗口</text>
  <path d="M465 1315H525" class="line"/><path d="M915 1315H975" class="line"/><path d="M1365 1315H1425" class="line"/>
</svg>
