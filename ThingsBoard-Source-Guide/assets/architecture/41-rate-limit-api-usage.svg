<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1740" viewBox="0 0 2200 1740" role="img" aria-labelledby="title desc">
  <title id="title">ThingsBoard 3.6 限流与 API Usage 架构</title>
  <desc id="desc">展示本机即时限流、API Usage 周期计量、TB_CORE 分区状态、数据库持久化、通知传播和各业务硬拒绝点。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1f2937"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#111827;letter-spacing:0}.title{font-size:42px;font-weight:700}.subtitle{font-size:20px;fill:#374151}.section{font-size:28px;font-weight:700}.label{font-size:22px;font-weight:700}.small{font-size:18px}.tiny{font-size:16px;fill:#374151}
      .band{fill:#f8fafc;stroke:#334155;stroke-width:2}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#166534;stroke-width:3}.amber{fill:#fef3c7;stroke:#92400e;stroke-width:3}.red{fill:#fee2e2;stroke:#991b1b;stroke-width:3}.violet{fill:#ede9fe;stroke:#5b21b6;stroke-width:3}.gray{fill:#f3f4f6;stroke:#374151;stroke-width:3}.cyan{fill:#cffafe;stroke:#0e7490;stroke-width:3}.line{fill:none;stroke:#1f2937;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#1f2937;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="2200" height="1740" fill="#ffffff"/>
  <text x="1100" y="58" text-anchor="middle" class="title">ThingsBoard 3.6 限流与 API Usage 架构</text>
  <text x="1100" y="92" text-anchor="middle" class="subtitle">Local Rate Buckets · Asynchronous Monthly Metering · Partition-Owned State · Eventual Enforcement</text>

  <rect x="35" y="125" width="2130" height="400" rx="6" class="band"/>
  <text x="1100" y="165" text-anchor="middle" class="section">即时限制：多个本机状态机，不是集群全局桶</text>

  <rect x="75" y="210" width="330" height="245" rx="5" class="blue"/>
  <text x="240" y="250" text-anchor="middle" class="label">REST / WS / Cassandra</text>
  <text x="105" y="292" class="small">DefaultRateLimitService</text>
  <text x="105" y="327" class="small">key = LimitedApi + level</text>
  <text x="105" y="362" class="small">Caffeine + LocalBucket</text>
  <text x="105" y="397" class="tiny">429 / failed future / drop update</text>
  <text x="105" y="430" class="tiny">empty config = allow + invalidate</text>

  <rect x="480" y="210" width="330" height="245" rx="5" class="violet"/>
  <text x="645" y="250" text-anchor="middle" class="label">Transport API 状态</text>
  <text x="510" y="292" class="small">tenantAllowed local map</text>
  <text x="510" y="327" class="small">DISABLED → API_USAGE_STATE</text>
  <text x="510" y="362" class="small">先于 tenant/device 桶</text>
  <text x="510" y="397" class="tiny">现有 session 不主动关闭</text>
  <text x="510" y="430" class="tiny">状态来自异步集群通知</text>

  <rect x="885" y="210" width="400" height="245" rx="5" class="green"/>
  <text x="1085" y="250" text-anchor="middle" class="label">Transport tenant / device</text>
  <text x="915" y="292" class="small">regular message bucket</text>
  <text x="915" y="327" class="small">telemetry message bucket</text>
  <text x="915" y="362" class="small">telemetry datapoint bucket</text>
  <text x="915" y="397" class="tiny">tenant → device 顺序消费，无回滚</text>
  <text x="915" y="430" class="tiny">每个 Transport JVM 独立</text>

  <rect x="1360" y="210" width="330" height="245" rx="5" class="amber"/>
  <text x="1525" y="250" text-anchor="middle" class="label">Transport IP 防护</text>
  <text x="1390" y="292" class="small">failureCount</text>
  <text x="1390" y="327" class="small">blocked + lastActivity</text>
  <text x="1390" y="362" class="small">auth success resets</text>
  <text x="1390" y="397" class="tiny">timeout unblock / inactivity clean</text>
  <text x="1390" y="430" class="tiny">不是 Bucket4j</text>

  <rect x="1765" y="210" width="360" height="245" rx="5" class="red"/>
  <text x="1945" y="250" text-anchor="middle" class="label">其他独立限制</text>
  <text x="1795" y="292" class="small">Rule Node per-message count</text>
  <text x="1795" y="327" class="small">entity/session/resource caps</text>
  <text x="1795" y="362" class="small">debug event local limiter</text>
  <text x="1795" y="397" class="tiny">各自重置与异常语义</text>
  <text x="1795" y="430" class="tiny">不能归并为同一个令牌桶</text>

  <path d="M405 332H480" class="dash"/>
  <path d="M810 332H885" class="line"/>
  <path d="M1285 332H1360" class="dash"/>
  <path d="M1690 332H1765" class="dash"/>

  <rect x="35" y="565" width="2130" height="430" rx="6" class="band"/>
  <text x="1100" y="605" text-anchor="middle" class="section">API Usage：本机汇总 → usage queue → TB_CORE owner</text>

  <rect x="75" y="655" width="350" height="265" rx="5" class="gray"/>
  <text x="250" y="695" text-anchor="middle" class="label">业务计量点</text>
  <text x="105" y="737" class="small">Transport success</text>
  <text x="105" y="772" class="small">Rule Node before execution</text>
  <text x="105" y="807" class="small">DB save success</text>
  <text x="105" y="842" class="small">JS/TBEL before execution</text>
  <text x="105" y="877" class="tiny">Mail / SMS / created alarm</text>

  <rect x="500" y="655" width="350" height="265" rx="5" class="cyan"/>
  <text x="675" y="695" text-anchor="middle" class="label">DefaultTbApiUsageReportClient</text>
  <text x="530" y="737" class="small">AtomicLong per key/level</text>
  <text x="530" y="772" class="small">tenant + SYS counters</text>
  <text x="530" y="807" class="small">optional customer metrics</text>
  <text x="530" y="842" class="small">default flush: 10 seconds</text>
  <text x="530" y="877" class="tiny">read + clear, no local WAL</text>

  <rect x="925" y="655" width="350" height="265" rx="5" class="amber"/>
  <text x="1100" y="695" text-anchor="middle" class="label">tb_usage_stats</text>
  <text x="955" y="737" class="small">TbQueue abstraction</text>
  <text x="955" y="772" class="small">in-memory default</text>
  <text x="955" y="807" class="small">Kafka / other providers optional</text>
  <text x="955" y="842" class="small">routed to TB_CORE partition</text>
  <text x="955" y="877" class="tiny">no exactly-once usage ledger</text>

  <rect x="1350" y="655" width="350" height="265" rx="5" class="blue"/>
  <text x="1525" y="695" text-anchor="middle" class="label">Usage consumer</text>
  <text x="1380" y="737" class="small">single consumer executor</text>
  <text x="1380" y="772" class="small">poll pack + callbacks</text>
  <text x="1380" y="807" class="small">wait pack timeout</text>
  <text x="1380" y="842" class="small">commit whole pack</text>
  <text x="1380" y="877" class="tiny">failed/timeout item still committed</text>

  <rect x="1775" y="655" width="350" height="265" rx="5" class="violet"/>
  <text x="1950" y="695" text-anchor="middle" class="label">TB_CORE partition owner</text>
  <text x="1805" y="737" class="small">one updateLock per service</text>
  <text x="1805" y="772" class="small">UTC month + hour counts</text>
  <text x="1805" y="807" class="small">counter add / gauge sum</text>
  <text x="1805" y="842" class="small">tenant threshold calculation</text>
  <text x="1805" y="877" class="tiny">customer metrics: no hard state</text>

  <path d="M425 787H500" class="line"/>
  <path d="M850 787H925" class="line"/>
  <path d="M1275 787H1350" class="line"/>
  <path d="M1700 787H1775" class="line"/>

  <rect x="35" y="1035" width="2130" height="430" rx="6" class="band"/>
  <text x="1100" y="1075" text-anchor="middle" class="section">状态数据与最终传播：WARNING 通知，DISABLED 才硬停</text>

  <rect x="75" y="1125" width="350" height="265" rx="5" class="green"/>
  <text x="250" y="1165" text-anchor="middle" class="label">Timeseries</text>
  <text x="105" y="1207" class="small">month count @ month start</text>
  <text x="105" y="1242" class="small">countHourly @ hour start</text>
  <text x="105" y="1277" class="small">profile limit + state history</text>
  <text x="105" y="1312" class="small">TTL 0 internal save</text>
  <text x="105" y="1347" class="tiny">async future; WS after success</text>

  <rect x="500" y="1125" width="350" height="265" rx="5" class="blue"/>
  <text x="675" y="1165" text-anchor="middle" class="label">api_usage_state</text>
  <text x="530" y="1207" class="small">8 feature states</text>
  <text x="530" y="1242" class="small">ENABLED / WARNING / DISABLED</text>
  <text x="530" y="1277" class="small">unique tenant_id + entity_id</text>
  <text x="530" y="1312" class="small">JPA state update</text>
  <text x="530" y="1347" class="tiny">not one transaction with TS</text>

  <rect x="925" y="1125" width="350" height="265" rx="5" class="amber"/>
  <text x="1100" y="1165" text-anchor="middle" class="label">通知</text>
  <text x="955" y="1207" class="small">ApiUsageLimitTrigger</text>
  <text x="955" y="1242" class="small">filter feature + status</text>
  <text x="955" y="1277" class="small">direct tenant email</text>
  <text x="955" y="1312" class="small">state timeseries + WebSocket</text>
  <text x="955" y="1347" class="tiny">WARNING does not reject</text>

  <rect x="1350" y="1125" width="350" height="265" rx="5" class="violet"/>
  <text x="1525" y="1165" text-anchor="middle" class="label">Transport 广播</text>
  <text x="1380" y="1207" class="small">encoded full ApiUsageState</text>
  <text x="1380" y="1242" class="small">per-service notification topic</text>
  <text x="1380" y="1277" class="small">update tenantAllowed</text>
  <text x="1380" y="1312" class="small">callback not awaited by owner</text>
  <text x="1380" y="1347" class="tiny">eventual cache convergence</text>

  <rect x="1775" y="1125" width="350" height="265" rx="5" class="red"/>
  <text x="1950" y="1165" text-anchor="middle" class="label">Core / Rule Engine Actor</text>
  <text x="1805" y="1207" class="small">lifecycle UPDATED</text>
  <text x="1805" y="1242" class="small">evict non-owner state cache</text>
  <text x="1805" y="1277" class="small">TenantActor reload</text>
  <text x="1805" y="1312" class="small">init / destroy rule chains</text>
  <text x="1805" y="1347" class="tiny">disabled queue msg: ack, no execute</text>

  <path d="M1950 920V1010H250V1125" class="line"/>
  <path d="M425 1257H500" class="dash"/>
  <path d="M850 1257H925" class="line"/>
  <path d="M1275 1257H1350" class="line"/>
  <path d="M1700 1257H1775" class="line"/>

  <rect x="35" y="1505" width="2130" height="190" rx="6" class="band"/>
  <text x="1100" y="1545" text-anchor="middle" class="section">硬拒绝与一致性边界</text>
  <text x="85" y="1590" class="small">DISABLED：Transport callback error · DB save failure · Rule Engine ack without execution · JS/TBEL failed future · Mail/SMS/Alarm exception</text>
  <text x="85" y="1630" class="small">一致性：本机 rate buckets 不共享；月度状态由一个 owner 计算，但 row、timeseries、queue commit 与广播没有共同事务或全局 barrier</text>
  <text x="85" y="1670" class="tiny">风险：report/clear/send 可少计，commit 前崩溃可重复计，失败/超时后 commit 可少计；月初重置只接受 nextCycle 后一小时内的常驻状态</text>
</svg>
