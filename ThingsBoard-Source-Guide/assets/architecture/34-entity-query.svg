<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1570" viewBox="0 0 2200 1570" role="img" aria-labelledby="title desc">
  <title id="title">ThingsBoard 3.6 Entity Query 架构</title>
  <desc id="desc">展示 EntityDataQuery 模型、动态 SQL、关系递归、latest joins、权限和分页风险。</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1f2937"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#111827;letter-spacing:0}.title{font-size:42px;font-weight:700}.subtitle{font-size:20px;fill:#374151}.section{font-size:28px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:19px}.tiny{font-size:17px;fill:#374151}.edge{font-size:17px;font-weight:600}
      .band{fill:#f8fafc;stroke:#334155;stroke-width:2}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#166534;stroke-width:3}.amber{fill:#fef3c7;stroke:#92400e;stroke-width:3}.red{fill:#fee2e2;stroke:#991b1b;stroke-width:3}.violet{fill:#ede9fe;stroke:#5b21b6;stroke-width:3}.gray{fill:#f3f4f6;stroke:#374151;stroke-width:3}.line{fill:none;stroke:#1f2937;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#1f2937;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="2200" height="1570" fill="#fff"/>
  <text x="1100" y="58" text-anchor="middle" class="title">ThingsBoard 3.6 Entity Query 架构</text>
  <text x="1100" y="92" text-anchor="middle" class="subtitle">EntityDataQuery · Filter/Predicate · Dynamic SQL · Recursive Relation · Latest Join · Offset Page</text>

  <rect x="35" y="125" width="2130" height="390" rx="6" class="band"/><text x="1100" y="165" text-anchor="middle" class="section">入口与服务链</text>
  <rect x="75" y="210" width="300" height="210" rx="5" class="gray"/><text x="225" y="250" text-anchor="middle" class="label">REST / WebSocket</text><text x="105" y="292" class="small">POST /count</text><text x="105" y="329" class="small">POST /find</text><text x="105" y="366" class="small">POST /find/keys</text><text x="105" y="403" class="small">WS ENTITY_DATA initial fetch</text>
  <rect x="470" y="210" width="330" height="210" rx="5" class="amber"/><text x="635" y="250" text-anchor="middle" class="label">Security + Query Service</text><text x="500" y="292" class="small">role gate + tenant/customer context</text><text x="500" y="329" class="small">resolve dynamic predicate values</text><text x="500" y="366" class="small">validate filter/page basics</text><text x="500" y="403" class="tiny">不是逐实体 PermissionChecker</text>
  <rect x="895" y="190" width="360" height="250" rx="5" class="blue"/><text x="1075" y="230" text-anchor="middle" class="label">DefaultEntityQueryRepository</text><text x="925" y="274" class="small">选择白名单 entity table</text><text x="925" y="311" class="small">EntityKeyMapping + QueryContext</text><text x="925" y="348" class="small">permission / filter / selection / sort</text><text x="925" y="385" class="small">count SQL + data SQL</text><text x="925" y="418" class="tiny">NamedParameterJdbcTemplate</text>
  <rect x="1350" y="210" width="340" height="210" rx="5" class="green"/><text x="1520" y="250" text-anchor="middle" class="label">PostgreSQL</text><text x="1380" y="292" class="small">entity metadata tables</text><text x="1380" y="329" class="small">relation</text><text x="1380" y="366" class="small">attribute_kv</text><text x="1380" y="403" class="small">ts_kv_latest + dictionary</text>
  <rect x="1785" y="210" width="330" height="210" rx="5" class="violet"/><text x="1950" y="250" text-anchor="middle" class="label">Result consumers</text><text x="1815" y="292" class="small">REST PageData</text><text x="1815" y="329" class="small">WS initial EntityDataUpdate</text><text x="1815" y="366" class="small">Alarm entity preselection</text><text x="1815" y="403" class="tiny">实时订阅是后续独立链</text>
  <path d="M375 315H470" class="line"/><path d="M800 315H895" class="line"/><path d="M1255 315H1350" class="line"/><path d="M1690 315H1785" class="line"/>

  <rect x="35" y="550" width="2130" height="510" rx="6" class="band"/><text x="1100" y="590" text-anchor="middle" class="section">Query 模型与 SQL 生成</text>
  <rect x="75" y="650" width="335" height="320" rx="5" class="blue"/><text x="243" y="690" text-anchor="middle" class="label">EntityDataQuery</text><text x="105" y="735" class="small">EntityFilter：14 种多态类型</text><text x="105" y="772" class="small">KeyFilters：key + predicate</text><text x="105" y="809" class="small">Entity fields / latest values</text><text x="105" y="846" class="small">EntityDataPageLink：sort/page/text</text><text x="105" y="883" class="small">valueType 字段不参与 SQL</text><text x="105" y="920" class="tiny">dynamic: user &gt; resolved &gt; default</text>
  <rect x="500" y="630" width="360" height="360" rx="5" class="amber"/><text x="680" y="670" text-anchor="middle" class="label">Filter → FROM / WHERE</text><text x="530" y="715" class="small">single/list/name/type</text><text x="530" y="752" class="small">device/asset/view/edge type</text><text x="530" y="789" class="small">API usage derived table</text><text x="530" y="826" class="small">search query target table</text><text x="530" y="863" class="small">RelationsQuery recursive CTE</text><text x="530" y="900" class="small">String/Numeric/Boolean/Complex</text><text x="530" y="937" class="tiny">值参数绑定；表/列/操作符来自白名单</text>
  <rect x="950" y="630" width="360" height="360" rx="5" class="green"/><text x="1130" y="670" text-anchor="middle" class="label">EntityKeyMapping</text><text x="980" y="715" class="small">projection 不去重；重复 key 重复 join</text><text x="980" y="752" class="small">TS → ts_kv_latest join</text><text x="980" y="789" class="small">scoped attr → attribute_kv join</text><text x="980" y="826" class="small">generic attr → LATERAL latest row</text><text x="980" y="863" class="small">alias 前缀可误认 filter 参数</text><text x="980" y="900" class="small">多类型列 coalesce 输出 String</text><text x="980" y="937" class="tiny">未知 field 可能静默放宽 predicate</text>
  <rect x="1400" y="630" width="330" height="360" rx="5" class="violet"/><text x="1565" y="670" text-anchor="middle" class="label">Relation CTE</text><text x="1430" y="715" class="small">COMMON type group only</text><text x="1430" y="752" class="small">FROM / TO 模板交换</text><text x="1430" y="789" class="small">UUID path 防环</text><text x="1430" y="826" class="small">max level 取配置，发行默认 50</text><text x="1430" y="863" class="small">结果端 relation/entity filters</text><text x="1430" y="900" class="small">leaf 判断条件与递归项不一致</text><text x="1430" y="937" class="tiny">不同类型相同 UUID 仍可能误判环</text>
  <rect x="1820" y="650" width="295" height="320" rx="5" class="red"/><text x="1968" y="690" text-anchor="middle" class="label">查询成本</text><text x="1850" y="735" class="small">count 后再 data</text><text x="1850" y="772" class="small">无共享 snapshot</text><text x="1850" y="809" class="small">无 sort 则无 ORDER BY</text><text x="1850" y="846" class="small">LIMIT + deep OFFSET</text><text x="1850" y="883" class="small">无 repository query timeout</text><text x="1850" y="920" class="tiny">无 /find 最大 pageSize</text>
  <path d="M410 810H500" class="line"/><path d="M860 810H950" class="line"/><path d="M1310 810H1400" class="line"/><path d="M1730 810H1820" class="line"/>

  <rect x="35" y="1095" width="2130" height="420" rx="6" class="band"/><text x="1100" y="1135" text-anchor="middle" class="section">权限、运行时边界与生产风险</text>
  <rect x="75" y="1185" width="390" height="260" rx="5" class="amber"/><text x="270" y="1225" text-anchor="middle" class="label">权限与范围</text><text x="105" y="1268" class="small">REST @PreAuthorize</text><text x="105" y="1305" class="small">普通 SQL tenant/customer predicate</text><text x="105" y="1342" class="small">internal / SYS count 可 ignore permission</text><text x="105" y="1379" class="small">keys 保留 page，仅 pageSize=100</text><text x="105" y="1416" class="tiny">RelationsQuery 按 root type 套 permission</text>
  <rect x="525" y="1185" width="390" height="260" rx="5" class="red"/><text x="720" y="1225" text-anchor="middle" class="label">结果语义风险</text><text x="555" y="1268" class="small">count 与 data 可看到不同状态</text><text x="555" y="1305" class="small">multi-root 追加 ID 仍不是全序</text><text x="555" y="1342" class="small">generic ATTRIBUTE 无 scope 优先级</text><text x="555" y="1379" class="small">find total / WS count 有 int 边界</text><text x="555" y="1416" class="tiny">predicate type 决定存储列，不看 valueType</text>
  <rect x="975" y="1185" width="390" height="260" rx="5" class="violet"/><text x="1170" y="1225" text-anchor="middle" class="label">非参与组件</text><text x="1005" y="1268" class="small">初始 query 不走 Actor</text><text x="1005" y="1305" class="small">不走 Kafka / TbQueue</text><text x="1005" y="1342" class="small">不使用 DAO entity cache</text><text x="1005" y="1379" class="small">WS 实时订阅注册发生在查询后</text><text x="1005" y="1416" class="tiny">Alarm count 也是另一条 repository 链</text>
  <rect x="1425" y="1185" width="690" height="260" rx="5" class="blue"/><text x="1770" y="1225" text-anchor="middle" class="label">生产排查</text><text x="1455" y="1268" class="small">记录 filter、selection/latest key 数、pageSize/page、最终 SQL shape</text><text x="1455" y="1305" class="small">EXPLAIN ANALYZE recursive CTE、LATERAL、dictionary subquery 与 joins</text><text x="1455" y="1342" class="small">观察 Hikari wait、statement duration、temp spill、rows removed by filter</text><text x="1455" y="1379" class="small">限制 pageSize/maxLevel/latest keys，优先稳定排序与浅分页</text><text x="1455" y="1416" class="tiny">不要把 relations.query_timeout 误认为 Entity Query statement timeout</text>
  <path d="M465 1315H525" class="line"/><path d="M915 1315H975" class="line"/><path d="M1365 1315H1425" class="line"/>
</svg>
