<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1080" viewBox="0 0 1700 1080" role="img" aria-labelledby="title desc">
  <title id="title">ThingsBoard 3.6 Kafka consumer architecture</title>
  <desc id="desc">High contrast architecture of subscriptions, Kafka polling, Rule Engine pack processing, Actor callbacks, retry and commit boundaries.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#253746"/></marker>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#176b87"/></marker>
    <style>.title{font:700 34px Arial,'Microsoft YaHei',sans-serif;fill:#111827}.section{font:700 22px Arial,'Microsoft YaHei',sans-serif;fill:#111827}.label{font:600 18px Arial,'Microsoft YaHei',sans-serif;fill:#111827}.small{font:15px Arial,'Microsoft YaHei',sans-serif;fill:#111827}.edge{font:15px Arial,'Microsoft YaHei',sans-serif;fill:#111827;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}.box{fill:#fff;stroke:#334155;stroke-width:2}.blue{fill:#eef6f8;stroke:#176b87;stroke-width:2}.amber{fill:#fff7e8;stroke:#9a5b13;stroke-width:2}.green{fill:#ecfdf5;stroke:#047857;stroke-width:2}.red{fill:#fff1f2;stroke:#be123c;stroke-width:2}.band{fill:#f8fafc;stroke:#64748b;stroke-width:2}.line{fill:none;stroke:#253746;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#176b87;stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#blueArrow)}</style>
  </defs>
  <rect width="1700" height="1080" fill="#fff"/>
  <text x="850" y="50" text-anchor="middle" class="title">ThingsBoard 3.6 Kafka：Poll Pack、Actor Callback、Retry 与 Commit</text>

  <rect x="35" y="82" width="330" height="885" rx="6" class="band"/><text x="200" y="120" text-anchor="middle" class="section">Kafka Consumer Layer</text>
  <rect x="65" y="155" width="270" height="115" rx="5" class="blue"/><text x="200" y="194" text-anchor="middle" class="label">Partition / Queue Manager</text><text x="200" y="225" text-anchor="middle" class="small">latest TopicPartitionInfo set</text><text x="200" y="251" text-anchor="middle" class="small">one or many consumer tasks</text>
  <rect x="65" y="335" width="270" height="140" rx="5" class="green"/><text x="200" y="374" text-anchor="middle" class="label">Abstract Consumer Template</text><text x="200" y="405" text-anchor="middle" class="small">subscribeQueue + nonfair lock</text><text x="200" y="433" text-anchor="middle" class="small">poll · decode · commit · close</text><text x="200" y="459" text-anchor="middle" class="small">subscription applied on next poll</text>
  <rect x="65" y="540" width="270" height="155" rx="5" class="amber"/><text x="200" y="579" text-anchor="middle" class="label">KafkaConsumer</text><text x="200" y="610" text-anchor="middle" class="small">subscribe physical topics</text><text x="200" y="638" text-anchor="middle" class="small">auto commit=false</text><text x="200" y="666" text-anchor="middle" class="small">poll advances local position</text>
  <rect x="65" y="760" width="270" height="165" rx="5" class="red"/><text x="200" y="799" text-anchor="middle" class="label">Group Coordinator</text><text x="200" y="830" text-anchor="middle" class="small">assignment + rebalance</text><text x="200" y="858" text-anchor="middle" class="small">commitSync current positions</text><text x="200" y="886" text-anchor="middle" class="small">max.poll.interval boundary</text>

  <rect x="400" y="82" width="445" height="885" rx="6" class="band"/><text x="622" y="120" text-anchor="middle" class="section">Rule Engine Pack Controller</text>
  <rect x="435" y="155" width="375" height="130" rx="5" class="green"/><text x="622" y="194" text-anchor="middle" class="label">Consumer Loop</text><text x="622" y="225" text-anchor="middle" class="small">poll one pack · block until decision</text><text x="622" y="253" text-anchor="middle" class="small">no next poll during processing</text>
  <rect x="435" y="350" width="180" height="155" rx="5" class="blue"/><text x="525" y="389" text-anchor="middle" class="label">Submit Strategy</text><text x="525" y="420" text-anchor="middle" class="small">BURST / BATCH</text><text x="525" y="448" text-anchor="middle" class="small">SEQUENTIAL</text><text x="525" y="476" text-anchor="middle" class="small">originator / tenant</text>
  <rect x="630" y="350" width="180" height="155" rx="5" class="amber"/><text x="720" y="389" text-anchor="middle" class="label">Pack Context</text><text x="720" y="420" text-anchor="middle" class="small">pending map</text><text x="720" y="448" text-anchor="middle" class="small">success / failed</text><text x="720" y="476" text-anchor="middle" class="small">latch + canceled</text>
  <rect x="435" y="575" width="375" height="155" rx="5" class="green"/><text x="622" y="614" text-anchor="middle" class="label">Processing Strategy</text><text x="622" y="645" text-anchor="middle" class="small">SKIP or RETRY selected result maps</text><text x="622" y="673" text-anchor="middle" class="small">retry pause runs on consumer thread</text><text x="622" y="701" text-anchor="middle" class="small">commit decision covers entire pack</text>
  <rect x="435" y="800" width="375" height="125" rx="5" class="red"/><text x="622" y="839" text-anchor="middle" class="label">Cleanup after every attempt</text><text x="622" y="870" text-anchor="middle" class="small">clear maps · late work may continue</text><text x="622" y="898" text-anchor="middle" class="small">retry does not rollback side effects</text>

  <rect x="880" y="82" width="420" height="885" rx="6" class="band"/><text x="1090" y="120" text-anchor="middle" class="section">Asynchronous Business Runtime</text>
  <rect x="915" y="155" width="350" height="130" rx="5" class="blue"/><text x="1090" y="194" text-anchor="middle" class="label">App → Tenant → Chain → Node</text><text x="1090" y="225" text-anchor="middle" class="small">separate Actor mailbox turns</text><text x="1090" y="253" text-anchor="middle" class="small">tell is not pack completion</text>
  <rect x="915" y="350" width="350" height="145" rx="5" class="amber"/><text x="1090" y="389" text-anchor="middle" class="label">Rule Nodes / Async Services</text><text x="1090" y="420" text-anchor="middle" class="small">database · HTTP · Kafka · executor</text><text x="1090" y="448" text-anchor="middle" class="small">side effects may outlive timeout</text><text x="1090" y="476" text-anchor="middle" class="small">old and retry attempts may overlap</text>
  <rect x="915" y="575" width="350" height="155" rx="5" class="green"/><text x="1090" y="614" text-anchor="middle" class="label">TbMsgPackCallback</text><text x="1090" y="645" text-anchor="middle" class="small">success / failure moves map entry</text><text x="1090" y="673" text-anchor="middle" class="small">rate limit maps to success</text><text x="1090" y="701" text-anchor="middle" class="small">isMsgValid gates late continuation</text>
  <rect x="915" y="800" width="350" height="125" rx="5" class="red"/><text x="1090" y="839" text-anchor="middle" class="label">No Actor-offset transaction</text><text x="1090" y="870" text-anchor="middle" class="small">DB commit and Kafka offset separate</text><text x="1090" y="898" text-anchor="middle" class="small">idempotency required</text>

  <rect x="1335" y="82" width="330" height="885" rx="6" class="band"/><text x="1500" y="120" text-anchor="middle" class="section">Outcomes and Risks</text>
  <rect x="1370" y="155" width="260" height="130" rx="5" class="green"/><text x="1500" y="194" text-anchor="middle" class="label">Commit Path</text><text x="1500" y="225" text-anchor="middle" class="small">decision commit=true</text><text x="1500" y="253" text-anchor="middle" class="small">Kafka commitSync</text>
  <rect x="1370" y="350" width="260" height="145" rx="5" class="amber"/><text x="1500" y="389" text-anchor="middle" class="label">Retry Path</text><text x="1500" y="420" text-anchor="middle" class="small">in-memory resubmit</text><text x="1500" y="448" text-anchor="middle" class="small">no Kafka re-poll</text><text x="1500" y="476" text-anchor="middle" class="small">no side-effect rollback</text>
  <rect x="1370" y="575" width="260" height="155" rx="5" class="red"/><text x="1500" y="614" text-anchor="middle" class="label">Timeout / Rebalance</text><text x="1500" y="645" text-anchor="middle" class="small">old work can continue</text><text x="1500" y="673" text-anchor="middle" class="small">new owner may replay</text><text x="1500" y="701" text-anchor="middle" class="small">commit can fail</text>
  <rect x="1370" y="800" width="260" height="125" rx="5" class="red"/><text x="1500" y="839" text-anchor="middle" class="label">Decode Poison Gap</text><text x="1500" y="870" text-anchor="middle" class="small">outer catch has no seek / DLQ</text><text x="1500" y="898" text-anchor="middle" class="small">later commit may skip record</text>

  <path d="M200 270 L200 335" class="line"/><path d="M200 475 L200 540" class="line"/><path d="M200 695 L200 760" class="dash"/>
  <path d="M335 615 L380 615 L380 220 L435 220" class="line"/>
  <path d="M622 285 L525 350" class="line"/><path d="M622 285 L720 350" class="line"/>
  <path d="M525 505 L525 535 L870 535 L870 220 L915 220" class="line"/>
  <path d="M1265 422 L1285 422 L1285 545 L1175 545 L1175 575" class="dash"/>
  <path d="M915 650 L810 650" class="line"/>
  <path d="M622 730 L622 800" class="line"/>
  <path d="M810 610 L850 610 L850 305 L1335 305 L1335 220 L1370 220" class="line"/>
  <path d="M810 690 L860 690 L860 530 L1320 530 L1320 422 L1370 422" class="dash"/>
  <path d="M1500 285 L1500 320 L350 320 L350 842 L335 842" class="dash"/>
  <path d="M1500 730 L1500 800" class="dash"/>
  <text x="350" y="602" class="edge">decoded pack</text><text x="825" y="523" class="edge">submit</text><text x="835" y="638" class="edge">callback</text><text x="1270" y="518" class="edge">retry decision</text><text x="865" y="296" class="edge">commit decision</text>
  <text x="850" y="1015" text-anchor="middle" class="small">Submit Strategy controls concurrency. Processing Strategy controls in-memory retry versus whole-pack commit. Neither reverses completed business side effects.</text>
  <text x="850" y="1042" text-anchor="middle" class="small">Poll advances local position before processing; decode and escaped-processing failures have no explicit seek, while timeout and rebalance can overlap old and replayed work.</text>
</svg>
