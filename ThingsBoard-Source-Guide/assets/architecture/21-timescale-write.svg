<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1200" viewBox="0 0 1780 1200" role="img" aria-labelledby="title desc">
  <title id="title">ThingsBoard 3.6 TimescaleDB telemetry write architecture</title>
  <desc id="desc">High contrast architecture showing conditional DAO selection, SQL batching, Timescale chunk routing, latest table and TTL deletion.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#253746"/></marker>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#176b87"/></marker>
    <style>.title{font:700 34px Arial,'Microsoft YaHei',sans-serif;fill:#111827}.section{font:700 22px Arial,'Microsoft YaHei',sans-serif;fill:#111827}.label{font:600 18px Arial,'Microsoft YaHei',sans-serif;fill:#111827}.small{font:15px Arial,'Microsoft YaHei',sans-serif;fill:#111827}.edge{font:15px Arial,'Microsoft YaHei',sans-serif;fill:#111827;paint-order:stroke;stroke:#fff;stroke-width:8;stroke-linejoin:round}.band{fill:#f8fafc;stroke:#64748b;stroke-width:2}.blue{fill:#eef8fb;stroke:#176b87;stroke-width:2}.amber{fill:#fff7e8;stroke:#9a5b13;stroke-width:2}.green{fill:#ecfdf5;stroke:#047857;stroke-width:2}.red{fill:#fff1f2;stroke:#be123c;stroke-width:2}.gray{fill:#f3f4f6;stroke:#4b5563;stroke-width:2}.line{fill:none;stroke:#253746;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#176b87;stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#blueArrow)}</style>
  </defs>
  <rect width="1780" height="1200" fill="#fff"/>
  <text x="890" y="52" text-anchor="middle" class="title">ThingsBoard 3.6 TimescaleDB：批量写、Chunk 路由、Latest 与 TTL 边界</text>

  <rect x="35" y="85" width="400" height="1010" rx="6" class="band"/>
  <text x="235" y="125" text-anchor="middle" class="section">Application and Futures</text>
  <rect x="75" y="165" width="320" height="130" rx="5" class="blue"/>
  <text x="235" y="205" text-anchor="middle" class="label">Telemetry Entry</text>
  <text x="235" y="236" text-anchor="middle" class="small">MQTT · HTTP · Rule Engine · REST</text>
  <text x="235" y="264" text-anchor="middle" class="small">TsKvEntry list · ttl · saveLatest</text>
  <rect x="75" y="350" width="320" height="170" rx="5" class="green"/>
  <text x="235" y="390" text-anchor="middle" class="label">BaseTimeseriesService</text>
  <text x="235" y="421" text-anchor="middle" class="small">savePartition = immediate no-op</text>
  <text x="235" y="449" text-anchor="middle" class="small">history Future + optional latest Future</text>
  <text x="235" y="477" text-anchor="middle" class="small">allAsList is an application barrier</text>
  <rect x="75" y="590" width="320" height="150" rx="5" class="amber"/>
  <text x="235" y="630" text-anchor="middle" class="label">Completion Boundary</text>
  <text x="235" y="661" text-anchor="middle" class="small">both independent Futures succeed</text>
  <text x="235" y="689" text-anchor="middle" class="small">then notify WebSocket / Entity View</text>
  <text x="235" y="717" text-anchor="middle" class="small">then Rule Node callback</text>
  <rect x="75" y="810" width="320" height="180" rx="5" class="red"/>
  <text x="235" y="850" text-anchor="middle" class="label">Partial Success Window</text>
  <text x="235" y="881" text-anchor="middle" class="small">history and latest do not share a TX</text>
  <text x="235" y="909" text-anchor="middle" class="small">Kafka offset is outside PostgreSQL</text>
  <text x="235" y="937" text-anchor="middle" class="small">retry repeats the whole Rule Chain</text>
  <text x="235" y="965" text-anchor="middle" class="small">notifications may be suppressed on failure</text>

  <rect x="475" y="85" width="400" height="1010" rx="6" class="band"/>
  <text x="675" y="125" text-anchor="middle" class="section">DAO Batching</text>
  <rect x="515" y="165" width="320" height="150" rx="5" class="blue"/>
  <text x="675" y="205" text-anchor="middle" class="label">Key Dictionary</text>
  <text x="675" y="236" text-anchor="middle" class="small">ConcurrentMap then PostgreSQL lookup</text>
  <text x="675" y="264" text-anchor="middle" class="small">JVM creation lock + DB UNIQUE</text>
  <text x="675" y="292" text-anchor="middle" class="small">string key becomes integer key_id</text>
  <rect x="515" y="375" width="320" height="190" rx="5" class="green"/>
  <text x="675" y="415" text-anchor="middle" class="label">History SQL Queues</text>
  <text x="675" y="446" text-anchor="middle" class="small">entity UUID hash · default 3 writers</text>
  <text x="675" y="474" text-anchor="middle" class="small">batch 10000 · max delay 100 ms</text>
  <text x="675" y="502" text-anchor="middle" class="small">optional full-PK sort</text>
  <text x="675" y="530" text-anchor="middle" class="small">unbounded LinkedBlockingQueue</text>
  <rect x="515" y="630" width="320" height="190" rx="5" class="amber"/>
  <text x="675" y="670" text-anchor="middle" class="label">Latest SQL Queues</text>
  <text x="675" y="701" text-anchor="middle" class="small">separate worker set and transaction</text>
  <text x="675" y="729" text-anchor="middle" class="small">merge duplicate entity + key in batch</text>
  <text x="675" y="757" text-anchor="middle" class="small">retain max payload timestamp</text>
  <text x="675" y="785" text-anchor="middle" class="small">timestamp guard enabled by default</text>
  <rect x="515" y="885" width="320" height="105" rx="5" class="red"/>
  <text x="675" y="925" text-anchor="middle" class="label">Queue Backlog</text>
  <text x="675" y="956" text-anchor="middle" class="small">no enqueue backpressure · heap risk</text>

  <rect x="915" y="85" width="400" height="1010" rx="6" class="band"/>
  <text x="1115" y="125" text-anchor="middle" class="section">PostgreSQL and Timescale</text>
  <rect x="955" y="165" width="320" height="150" rx="5" class="gray"/>
  <text x="1115" y="205" text-anchor="middle" class="label">ts_kv_dictionary</text>
  <text x="1115" y="236" text-anchor="middle" class="small">ordinary PostgreSQL table</text>
  <text x="1115" y="264" text-anchor="middle" class="small">key PK · serial key_id UNIQUE</text>
  <text x="1115" y="292" text-anchor="middle" class="small">no declared foreign keys</text>
  <rect x="955" y="375" width="320" height="190" rx="5" class="green"/>
  <text x="1115" y="415" text-anchor="middle" class="label">ts_kv Hypertable</text>
  <text x="1115" y="446" text-anchor="middle" class="small">one bigint time dimension: ts</text>
  <text x="1115" y="474" text-anchor="middle" class="small">PK entity_id + key + ts</text>
  <text x="1115" y="502" text-anchor="middle" class="small">JDBC batch INSERT ON CONFLICT</text>
  <text x="1115" y="530" text-anchor="middle" class="small">extension routes to internal chunks</text>
  <rect x="955" y="630" width="320" height="190" rx="5" class="amber"/>
  <text x="1115" y="670" text-anchor="middle" class="label">ts_kv_latest</text>
  <text x="1115" y="701" text-anchor="middle" class="small">ordinary PostgreSQL table</text>
  <text x="1115" y="729" text-anchor="middle" class="small">PK entity_id + key</text>
  <text x="1115" y="757" text-anchor="middle" class="small">UPDATE then conditional UPSERT</text>
  <text x="1115" y="785" text-anchor="middle" class="small">not removed by history TTL</text>
  <rect x="955" y="885" width="320" height="105" rx="5" class="blue"/>
  <text x="1115" y="925" text-anchor="middle" class="label">WAL and Transactions</text>
  <text x="1115" y="956" text-anchor="middle" class="small">one transaction per queue batch</text>

  <rect x="1355" y="85" width="390" height="1010" rx="6" class="band"/>
  <text x="1550" y="125" text-anchor="middle" class="section">Chunk and Data Lifecycle</text>
  <rect x="1390" y="165" width="320" height="180" rx="5" class="green"/>
  <text x="1550" y="205" text-anchor="middle" class="label">Time Chunk Routing</text>
  <text x="1550" y="236" text-anchor="middle" class="small">default interval 7 days</text>
  <text x="1550" y="264" text-anchor="middle" class="small">all entities share active time chunk</text>
  <text x="1550" y="292" text-anchor="middle" class="small">range predicate enables pruning</text>
  <text x="1550" y="320" text-anchor="middle" class="small">time_bucket scans raw chunk rows</text>
  <rect x="1390" y="405" width="320" height="190" rx="5" class="amber"/>
  <text x="1550" y="445" text-anchor="middle" class="label">ThingsBoard TTL Procedure</text>
  <text x="1550" y="476" text-anchor="middle" class="small">system / tenant / customer policy</text>
  <text x="1550" y="504" text-anchor="middle" class="small">device · asset · customer lookup</text>
  <text x="1550" y="532" text-anchor="middle" class="small">row DELETE from ts_kv</text>
  <text x="1550" y="560" text-anchor="middle" class="small">dead tuples require autovacuum</text>
  <rect x="1390" y="655" width="320" height="190" rx="5" class="red"/>
  <text x="1550" y="695" text-anchor="middle" class="label">Features Not Installed</text>
  <text x="1550" y="726" text-anchor="middle" class="small">no Continuous Aggregate</text>
  <text x="1550" y="754" text-anchor="middle" class="small">no compression policy</text>
  <text x="1550" y="782" text-anchor="middle" class="small">no Timescale retention policy</text>
  <text x="1550" y="810" text-anchor="middle" class="small">no drop_chunks cleanup</text>
  <rect x="1390" y="905" width="320" height="85" rx="5" class="blue"/>
  <text x="1550" y="940" text-anchor="middle" class="label">Request TTL</text>
  <text x="1550" y="969" text-anchor="middle" class="small">usage accounting only, not row expiry</text>

  <path d="M395 230 H505" class="line"/>
  <text x="450" y="214" text-anchor="middle" class="edge">key</text>
  <path d="M395 430 H505" class="line"/>
  <text x="450" y="414" text-anchor="middle" class="edge">history</text>
  <path d="M395 665 H505" class="line"/>
  <text x="450" y="649" text-anchor="middle" class="edge">latest</text>
  <path d="M835 245 H945" class="line"/>
  <text x="890" y="229" text-anchor="middle" class="edge">INSERT</text>
  <path d="M835 470 H945" class="line"/>
  <text x="890" y="454" text-anchor="middle" class="edge">batch TX</text>
  <path d="M835 725 H945" class="line"/>
  <text x="890" y="709" text-anchor="middle" class="edge">batch TX</text>
  <path d="M1275 470 H1380" class="line"/>
  <text x="1327" y="454" text-anchor="middle" class="edge">route</text>
  <path d="M1390 500 C1320 500 1320 520 1275 520" class="dash"/>
  <text x="1330" y="550" text-anchor="middle" class="edge">old rows</text>

  <rect x="75" y="1040" width="1635" height="105" rx="5" class="gray"/>
  <text x="892" y="1078" text-anchor="middle" class="label">Durability boundary</text>
  <text x="892" y="1108" text-anchor="middle" class="small">History transaction · Latest transaction · Kafka offset · WebSocket notification are four independent commits.</text>
  <text x="892" y="1135" text-anchor="middle" class="small">Monitor SQL queue depth, Hikari wait, WAL/checkpoint, active chunk index, TTL DELETE and autovacuum together.</text>
</svg>
