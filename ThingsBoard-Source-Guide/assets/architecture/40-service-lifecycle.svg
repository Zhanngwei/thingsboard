<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">ThingsBoard service startup and shutdown architecture</title>
  <desc id="desc">Three high contrast lanes show the independent installer, Java runtime service and Node.js JavaScript executor lifecycles, including ordered ready listeners and dependency-driven shutdown.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.lane{fill:#fff;stroke:#111827;stroke-width:2}.head{fill:#083b66}.head2{fill:#9a3412}.head3{fill:#166534}
      .box{fill:#e0f2fe;stroke:#075985;stroke-width:2}.box2{fill:#ffedd5;stroke:#9a3412;stroke-width:2}.box3{fill:#dcfce7;stroke:#166534;stroke-width:2}
      .warn{fill:#fef3c7;stroke:#92400e;stroke-width:2}.title{font:700 28px Arial,sans-serif;fill:#111827}.laneTitle{font:700 19px Arial,sans-serif;fill:#fff}
      .label{font:700 15px Arial,sans-serif;fill:#111827}.small{font:14px Arial,sans-serif;fill:#111827}.white{font:700 15px Arial,sans-serif;fill:#fff}
      .line{fill:none;stroke:#111827;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#111827;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="760"/>
  <text class="title" x="640" y="42" text-anchor="middle">ThingsBoard release-3.6 service lifecycle</text>

  <rect class="lane" x="35" y="70" width="1210" height="160" rx="6"/>
  <rect class="head2" x="35" y="70" width="190" height="160" rx="5"/>
  <text class="laneTitle" x="130" y="120" text-anchor="middle">Installer process</text>
  <text class="white" x="130" y="148" text-anchor="middle">profile: install</text>
  <text class="white" x="130" y="176" text-anchor="middle">one-shot context</text>
  <rect class="box2" x="265" y="105" width="205" height="90" rx="5"/>
  <text class="label" x="367" y="137" text-anchor="middle">Install main</text>
  <text class="small" x="367" y="162" text-anchor="middle">setAdditionalProfiles</text>
  <text class="small" x="367" y="183" text-anchor="middle">performInstall()</text>
  <rect class="box2" x="540" y="105" width="215" height="90" rx="5"/>
  <text class="label" x="647" y="137" text-anchor="middle">Schema / updater</text>
  <text class="small" x="647" y="162" text-anchor="middle">entities + time series</text>
  <text class="small" x="647" y="183" text-anchor="middle">system data</text>
  <rect class="box2" x="825" y="105" width="175" height="90" rx="5"/>
  <text class="label" x="912" y="143" text-anchor="middle">Database</text>
  <text class="small" x="912" y="170" text-anchor="middle">versioned state</text>
  <rect class="warn" x="1060" y="105" width="145" height="90" rx="5"/>
  <text class="label" x="1132" y="140" text-anchor="middle">exit context</text>
  <text class="small" x="1132" y="166" text-anchor="middle">not runtime</text>
  <path class="line" d="M470 150 H540"/><path class="line" d="M755 150 H825"/><path class="line" d="M1000 150 H1060"/>

  <rect class="lane" x="35" y="255" width="1210" height="300" rx="6"/>
  <rect class="head" x="35" y="255" width="190" height="300" rx="5"/>
  <text class="laneTitle" x="130" y="315" text-anchor="middle">Java runtime</text>
  <text class="white" x="130" y="344" text-anchor="middle">service.type</text>
  <text class="white" x="130" y="373" text-anchor="middle">conditional Bean graph</text>
  <text class="white" x="130" y="436" text-anchor="middle">startup: ordered</text>
  <text class="white" x="130" y="463" text-anchor="middle">Ready listeners</text>
  <text class="white" x="130" y="504" text-anchor="middle">shutdown: dependency</text>
  <text class="white" x="130" y="531" text-anchor="middle">graph + @PreDestroy</text>

  <rect class="box" x="260" y="285" width="180" height="78" rx="5"/>
  <text class="label" x="350" y="316" text-anchor="middle">Spring refresh</text>
  <text class="small" x="350" y="341" text-anchor="middle">inject + @PostConstruct</text>
  <rect class="box" x="495" y="285" width="190" height="78" rx="5"/>
  <text class="label" x="590" y="316" text-anchor="middle">Service discovery</text>
  <text class="small" x="590" y="341" text-anchor="middle">ZK / local partitions</text>
  <rect class="box" x="740" y="285" width="190" height="78" rx="5"/>
  <text class="label" x="835" y="316" text-anchor="middle">Actor + queues</text>
  <text class="small" x="835" y="341" text-anchor="middle">mailbox / consumers</text>
  <rect class="box" x="985" y="285" width="220" height="78" rx="5"/>
  <text class="label" x="1095" y="316" text-anchor="middle">Transport servers</text>
  <text class="small" x="1095" y="341" text-anchor="middle">ports may bind pre-ready</text>
  <path class="line" d="M440 324 H495"/><path class="line" d="M685 324 H740"/><path class="line" d="M930 324 H985"/>

  <rect class="box" x="260" y="402" width="180" height="105" rx="5"/>
  <text class="label" x="350" y="431" text-anchor="middle">Ready order</text>
  <text class="small" x="350" y="456" text-anchor="middle">1 → 2 → 8 → 9 → 10</text>
  <text class="small" x="350" y="480" text-anchor="middle">→ transport phases</text>
  <rect class="warn" x="495" y="402" width="190" height="105" rx="5"/>
  <text class="label" x="590" y="431" text-anchor="middle">Concurrency edge</text>
  <text class="small" x="590" y="456" text-anchor="middle">same-order unspecified</text>
  <text class="small" x="590" y="480" text-anchor="middle">workers continue async</text>
  <rect class="box" x="740" y="402" width="190" height="105" rx="5"/>
  <text class="label" x="835" y="431" text-anchor="middle">Runtime work</text>
  <text class="small" x="835" y="456" text-anchor="middle">poll → actor → DB</text>
  <text class="small" x="835" y="480" text-anchor="middle">callback → commit</text>
  <rect class="warn" x="985" y="402" width="220" height="105" rx="5"/>
  <text class="label" x="1095" y="431" text-anchor="middle">Close window</text>
  <text class="small" x="1095" y="456" text-anchor="middle">no SmartLifecycle phases</text>
  <text class="small" x="1095" y="480" text-anchor="middle">mixed await / shutdownNow</text>
  <path class="line" d="M440 454 H495"/><path class="line" d="M685 454 H740"/><path class="line" d="M930 454 H985"/>

  <rect class="lane" x="35" y="580" width="1210" height="145" rx="6"/>
  <rect class="head3" x="35" y="580" width="190" height="145" rx="5"/>
  <text class="laneTitle" x="130" y="625" text-anchor="middle">Node.js JS Executor</text>
  <text class="white" x="130" y="654" text-anchor="middle">independent process</text>
  <text class="white" x="130" y="683" text-anchor="middle">broker-coupled only</text>
  <rect class="box3" x="265" y="610" width="205" height="82" rx="5"/>
  <text class="label" x="367" y="641" text-anchor="middle">await queue.init()</text>
  <text class="small" x="367" y="667" text-anchor="middle">consumer + producer</text>
  <rect class="box3" x="540" y="610" width="185" height="82" rx="5"/>
  <text class="label" x="632" y="641" text-anchor="middle">Liveness HTTP</text>
  <text class="small" x="632" y="667" text-anchor="middle">opens after queue</text>
  <rect class="box3" x="795" y="610" width="185" height="82" rx="5"/>
  <text class="label" x="887" y="641" text-anchor="middle">Signal</text>
  <text class="small" x="887" y="667" text-anchor="middle">stop HTTP first</text>
  <rect class="box3" x="1050" y="610" width="155" height="82" rx="5"/>
  <text class="label" x="1127" y="641" text-anchor="middle">destroy queue</text>
  <text class="small" x="1127" y="667" text-anchor="middle">flush + exit</text>
  <path class="line" d="M470 651 H540"/><path class="dash" d="M725 651 H795"/><path class="line" d="M980 651 H1050"/>

  <text class="small" x="640" y="748" text-anchor="middle">Solid arrows are local call/order edges. Dashed arrow marks the independent signal-driven shutdown path.</text>
</svg>
