<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">ThingsBoard 3.6 Device 删除架构</title>
  <desc id="desc">展示 REST 删除事务、提交前队列通知、提交后缓存事件、协议会话与 Actor 清理，以及未自动删除的遥测和属性数据。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#35586a"/>
    </marker>
    <marker id="warnArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a35c1a"/>
    </marker>
    <style>
      .bg{fill:#f5f7f8}.panel{fill:#fff;stroke:#cbd5db;stroke-width:2}.lane{fill:#eef3f5;stroke:#c6d2d8;stroke-width:1.5}.box{fill:#fff;stroke:#527386;stroke-width:2}.db{fill:#fff8ed;stroke:#99682f;stroke-width:2}.queue{fill:#ecf7f5;stroke:#2f787c;stroke-width:2}.actor{fill:#f3f0f8;stroke:#66558a;stroke-width:2}.event{fill:#eef6fa;stroke:#2e708a;stroke-width:2}.warn{fill:#fff4e5;stroke:#a9671d;stroke-width:2}.residual{fill:#f8eeee;stroke:#9b4b4b;stroke-width:2}.title{font:700 30px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#17232b}.subtitle{font:15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#5b6871}.laneTitle{font:700 17px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#263842}.label{font:600 15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#18313f}.small{font:13px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#41545f}.tiny{font:12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#586a74}.white{fill:#fff}.edge{fill:none;stroke:#35586a;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#7b8790;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}.warnEdge{fill:none;stroke:#a35c1a;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#warnArrow)}.divider{stroke:#d7dfe3;stroke-width:1}.badge{fill:#1f6d70}.badgeWarn{fill:#a35c1a}.badgeText{font:700 12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#fff}
    </style>
  </defs>

  <rect class="bg" width="1600" height="1160"/>
  <rect class="panel" x="34" y="28" width="1532" height="1102" rx="8"/>
  <text class="title" x="72" y="76">ThingsBoard 3.6 Device 删除：数据库事务与运行时传播并非同一原子操作</text>
  <text class="subtitle" x="72" y="106">源码基线 3.6.4 / 0cb411fc90 · 标准 REST 主链 · Queue 在 COMMIT 前发送，缓存事件在 AFTER_COMMIT 执行</text>

  <rect class="lane" x="68" y="138" width="470" height="600" rx="6"/>
  <rect class="lane" x="563" y="138" width="452" height="600" rx="6"/>
  <rect class="lane" x="1040" y="138" width="490" height="600" rx="6"/>
  <text class="laneTitle" x="88" y="170">1. PostgreSQL 外层事务</text>
  <text class="laneTitle" x="583" y="170">2. COMMIT 前消息</text>
  <text class="laneTitle" x="1060" y="170">3. 异步运行时清理</text>

  <rect class="box" x="98" y="202" width="410" height="72" rx="6"/>
  <text class="label" x="303" y="230" text-anchor="middle">DeviceController.deleteDevice</text>
  <text class="small" x="303" y="252" text-anchor="middle">TENANT_ADMIN · checkDeviceId(DELETE)</text>

  <rect class="box" x="98" y="306" width="410" height="78" rx="6"/>
  <text class="label" x="303" y="334" text-anchor="middle">DefaultTbDeviceService @Transactional</text>
  <text class="small" x="303" y="356" text-anchor="middle">Alarm 删除 + Device DAO 删除 + 通知编排</text>
  <text class="tiny" x="303" y="376" text-anchor="middle">唯一覆盖完整 REST 删除语义的应用入口</text>

  <rect class="db" x="98" y="420" width="190" height="112" rx="6"/>
  <text class="label" x="193" y="449" text-anchor="middle">Alarm 聚合</text>
  <text class="small" x="193" y="472" text-anchor="middle">alarm</text>
  <text class="tiny" x="193" y="493" text-anchor="middle">relations · comments</text>
  <text class="tiny" x="193" y="513" text-anchor="middle">entity_alarm · alarm_types</text>

  <rect class="db" x="318" y="420" width="190" height="112" rx="6"/>
  <text class="label" x="413" y="449" text-anchor="middle">Device 聚合</text>
  <text class="small" x="413" y="472" text-anchor="middle">device_credentials</text>
  <text class="tiny" x="413" y="493" text-anchor="middle">inbound/outbound relation</text>
  <text class="tiny" x="413" y="513" text-anchor="middle">entity_alarm · device</text>

  <rect class="warn" x="98" y="568" width="410" height="64" rx="6"/>
  <text class="label" x="303" y="595" text-anchor="middle">Entity View 引用保护</text>
  <text class="small" x="303" y="617" text-anchor="middle">存在引用则整个外层事务 ROLLBACK</text>

  <rect class="event" x="98" y="664" width="410" height="48" rx="24"/>
  <text class="label" x="303" y="694" text-anchor="middle">COMMIT / ROLLBACK 决策发生在消息发送之后</text>

  <path class="edge" d="M303 274 V306"/>
  <path class="edge" d="M303 384 V402 H193 V420"/>
  <path class="edge" d="M303 384 V402 H413 V420"/>
  <path class="edge" d="M193 532 V550 H303 V568"/>
  <path class="edge" d="M413 532 V550 H303 V568"/>
  <path class="edge" d="M303 632 V664"/>

  <rect class="queue" x="593" y="202" width="190" height="78" rx="6"/>
  <text class="label" x="688" y="230" text-anchor="middle">Gateway RPC</text>
  <text class="small" x="688" y="252" text-anchor="middle">gateway_device_deleted</text>
  <text class="tiny" x="688" y="271" text-anchor="middle">optional · persistent</text>

  <rect class="queue" x="795" y="202" width="190" height="78" rx="6"/>
  <text class="label" x="890" y="230" text-anchor="middle">Transport 通知</text>
  <text class="small" x="890" y="252" text-anchor="middle">EntityDeleteMsg</text>
  <text class="tiny" x="890" y="271" text-anchor="middle">每个 Transport 节点</text>

  <rect class="queue" x="593" y="318" width="190" height="78" rx="6"/>
  <text class="label" x="688" y="346" text-anchor="middle">Core Queue</text>
  <text class="small" x="688" y="368" text-anchor="middle">DeviceState deleted=true</text>
  <text class="tiny" x="688" y="387" text-anchor="middle">按 Device 分区</text>

  <rect class="queue" x="795" y="318" width="190" height="78" rx="6"/>
  <text class="label" x="890" y="346" text-anchor="middle">Lifecycle 通知</text>
  <text class="small" x="890" y="368" text-anchor="middle">Device DELETED</text>
  <text class="tiny" x="890" y="387" text-anchor="middle">Rule Engine notification</text>

  <rect class="queue" x="593" y="434" width="190" height="78" rx="6"/>
  <text class="label" x="688" y="462" text-anchor="middle">Rule Engine Queue</text>
  <text class="small" x="688" y="484" text-anchor="middle">ENTITY_DELETED</text>
  <text class="tiny" x="688" y="503" text-anchor="middle">body = 删除前 Device JSON</text>

  <rect class="event" x="795" y="434" width="190" height="78" rx="6"/>
  <text class="label" x="890" y="462" text-anchor="middle">Audit executor</text>
  <text class="small" x="890" y="484" text-anchor="middle">可选 audit_log</text>
  <text class="tiny" x="890" y="503" text-anchor="middle">Future 不等待</text>

  <rect class="warn" x="593" y="552" width="392" height="80" rx="6"/>
  <text class="label" x="789" y="580" text-anchor="middle">所有核心 Queue callback = null</text>
  <text class="small" x="789" y="602" text-anchor="middle">无 transactional outbox · 不等待 Consumer</text>
  <text class="tiny" x="789" y="622" text-anchor="middle">后续 COMMIT 失败不会撤销已发消息</text>

  <rect class="event" x="593" y="664" width="392" height="48" rx="24"/>
  <text class="label" x="789" y="694" text-anchor="middle">AFTER_COMMIT：缓存失效 + Edge 删除事件</text>

  <path class="edge" d="M538 345 H563 V241 H593"/>
  <path class="edge" d="M538 345 H558 V190 H890 V202"/>
  <path class="edge" d="M538 345 H554 V357 H593"/>
  <path class="edge" d="M538 345 H550 V299 H890 V318"/>
  <path class="edge" d="M538 345 H546 V473 H593"/>
  <path class="edge" d="M538 345 H542 V415 H890 V434"/>
  <path class="dash" d="M688 512 V532 H789 V552"/>
  <path class="dash" d="M890 512 V532 H789 V552"/>
  <path class="warnEdge" d="M593 688 H530 V688 H508"/>

  <rect class="actor" x="1070" y="202" width="200" height="92" rx="6"/>
  <text class="label" x="1170" y="230" text-anchor="middle">Transport Service</text>
  <text class="small" x="1170" y="252" text-anchor="middle">移除 rate limit</text>
  <text class="tiny" x="1170" y="273" text-anchor="middle">匹配本节点 Sessions</text>

  <rect class="actor" x="1300" y="202" width="200" height="92" rx="6"/>
  <text class="label" x="1400" y="230" text-anchor="middle">协议会话</text>
  <text class="small" x="1400" y="252" text-anchor="middle">MQTT close</text>
  <text class="tiny" x="1400" y="273" text-anchor="middle">CoAP/LwM2M/Gateway cleanup</text>

  <rect class="actor" x="1070" y="340" width="200" height="92" rx="6"/>
  <text class="label" x="1170" y="368" text-anchor="middle">Device State</text>
  <text class="small" x="1170" y="390" text-anchor="middle">deviceStates.remove</text>
  <text class="tiny" x="1170" y="411" text-anchor="middle">无数据库遥测删除</text>

  <rect class="actor" x="1300" y="340" width="200" height="92" rx="6"/>
  <text class="label" x="1400" y="368" text-anchor="middle">TenantActor</text>
  <text class="small" x="1400" y="390" text-anchor="middle">getOrCreate DeviceActor</text>
  <text class="tiny" x="1400" y="411" text-anchor="middle">deletedDevices.add</text>

  <rect class="actor" x="1070" y="478" width="200" height="92" rx="6"/>
  <text class="label" x="1170" y="506" text-anchor="middle">DeviceActor</text>
  <text class="small" x="1170" y="528" text-anchor="middle">DeviceDeleteMsg</text>
  <text class="tiny" x="1170" y="549" text-anchor="middle">ctx.stop(self)</text>

  <rect class="actor" x="1300" y="478" width="200" height="92" rx="6"/>
  <text class="label" x="1400" y="506" text-anchor="middle">Rule Engine</text>
  <text class="small" x="1400" y="528" text-anchor="middle">执行 ENTITY_DELETED</text>
  <text class="tiny" x="1400" y="549" text-anchor="middle">与其他 topic 无全序</text>

  <rect class="warn" x="1070" y="616" width="430" height="96" rx="6"/>
  <text class="label" x="1285" y="645" text-anchor="middle">竞争窗口</text>
  <text class="small" x="1285" y="668" text-anchor="middle">Consumer 可能在 COMMIT 前看到旧 Device</text>
  <text class="small" x="1285" y="690" text-anchor="middle">也可能在 COMMIT 后只看到删除事件快照</text>

  <path class="edge" d="M985 241 H1070"/>
  <path class="edge" d="M1270 248 H1300"/>
  <path class="edge" d="M783 357 H789 V415 H1020 V386 H1070"/>
  <path class="edge" d="M985 357 H1025 V315 H1400 V340"/>
  <path class="edge" d="M1400 432 V454 H1170 V478"/>
  <path class="edge" d="M688 434 V415 H1028 V455 H1400 V478"/>

  <rect class="residual" x="68" y="778" width="1462" height="300" rx="6"/>
  <text class="laneTitle" x="88" y="812">4. 标准 Device 删除不会自动清理的数据</text>

  <rect class="db" x="98" y="850" width="250" height="102" rx="6"/>
  <text class="label" x="223" y="879" text-anchor="middle">attribute_kv</text>
  <text class="small" x="223" y="902" text-anchor="middle">client/shared/server 属性</text>
  <text class="tiny" x="223" y="925" text-anchor="middle">无 Device FK · 无删除调用</text>

  <rect class="db" x="378" y="850" width="250" height="102" rx="6"/>
  <text class="label" x="503" y="879" text-anchor="middle">TimescaleDB ts_kv</text>
  <text class="small" x="503" y="902" text-anchor="middle">history 横跨多个 chunk</text>
  <text class="tiny" x="503" y="925" text-anchor="middle">本链无 DELETE / retention</text>

  <rect class="db" x="658" y="850" width="250" height="102" rx="6"/>
  <text class="label" x="783" y="879" text-anchor="middle">ts_kv_latest</text>
  <text class="small" x="783" y="902" text-anchor="middle">latest 普通表</text>
  <text class="tiny" x="783" y="925" text-anchor="middle">不在 history TTL DELETE 中</text>

  <rect class="db" x="938" y="850" width="250" height="102" rx="6"/>
  <text class="label" x="1063" y="879" text-anchor="middle">Cassandra telemetry</text>
  <text class="small" x="1063" y="902" text-anchor="middle">history / latest partitions</text>
  <text class="tiny" x="1063" y="925" text-anchor="middle">只受自身 TTL/人工清理影响</text>

  <rect class="db" x="1218" y="850" width="250" height="102" rx="6"/>
  <text class="label" x="1343" y="879" text-anchor="middle">rpc / event / debug</text>
  <text class="small" x="1343" y="902" text-anchor="middle">设备相关持久记录</text>
  <text class="tiny" x="1343" y="925" text-anchor="middle">由各自 TTL/租户清理处理</text>

  <rect class="warn" x="98" y="990" width="1370" height="58" rx="6"/>
  <text class="label" x="783" y="1015" text-anchor="middle">SQL/Timescale TTL 过程按当前 device 表反查归属；device 行删除后，orphan history 可能无法再被命中</text>
  <text class="small" x="783" y="1038" text-anchor="middle">需要删除前显式清理、tombstone/housekeeping 或独立合规擦除流程</text>

  <rect class="badge" x="72" y="1092" width="158" height="24" rx="12"/>
  <text class="badgeText" x="151" y="1108" text-anchor="middle">SOURCE VERIFIED</text>
  <rect class="badgeWarn" x="244" y="1092" width="238" height="24" rx="12"/>
  <text class="badgeText" x="363" y="1108" text-anchor="middle">PRE-COMMIT NOTIFICATIONS</text>
  <text class="tiny" x="1500" y="1109" text-anchor="end">ThingsBoard-Source-Guide · Chapter 03</text>
</svg>
